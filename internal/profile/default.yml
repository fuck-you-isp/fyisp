# fyisp default profile: 87 targets in 7 groups (one dashboard panel each).
# Target names are identities: renaming one starts a new time series.
# The built-in "Network path" group (gateway, ISP edge, anycast resolvers) is
# added in code, before these groups (see package profile).
#
# Every target is probed with a TCP connect to port 443 (a target without
# `kinds` gets [tcp]) every `interval` (default 15s). An interval must be whole
# seconds, divisible by 3 and divide an hour evenly (6s, 9s, 12s, 15s, 30s,
# 60s, ...). The network path group keeps ICMP.
#
# One target per group has `trace: true`: an always-on traceroute every 5s
# (per-hop loss and latency, route changes).
name: default
version: "1"

groups:
  - id: common
    title: "Common Services (<100ms is good for audio/video calls)"
    order: 1
  - id: dns
    title: "DNS"
    order: 2
  - id: devtunnels
    title: "DevTunnels"
    order: 3
  - id: dev
    title: "Various Dev Related Services"
    order: 4
  - id: aws
    title: "Amazon Web Services"
    order: 5
  - id: hetzner
    title: "Hetzner"
    order: 6
  - id: gcp
    title: "Google Cloud Platform"
    order: 7

targets:
  # Common Services (<100ms is good for audio/video calls)
  # lens.l.google.com does not answer on TCP 443: TCP (and HTTPS, for files
  # that add it) goes to meet.google.com.
  - {name: Google-Meet, host: lens.l.google.com, group: common, host_overrides: {https: meet.google.com, tcp: meet.google.com}}
  - {name: Microsoft-Teams, host: teams.microsoft.com, group: common}
  - {name: Discord, host: discord.gg, group: common, trace: true}
  # DNS
  - {name: google-dns, host: 8.8.8.8, group: dns}
  - {name: cloudflare-dns, host: 1.1.1.1, group: dns, trace: true}
  - {name: quad9-dns, host: 9.9.9.9, group: dns}
  - {name: open-dns, host: 208.67.222.222, group: dns}
  # DevTunnels
