provider: oci
display: Oracle Cloud Infrastructure
kind: hyperscaler
category: [storage]
sources:
  - https://docs.oracle.com/en-us/iaas/Content/General/Concepts/regions.htm
notes: >-
  OCI publishes no ping host, so each region uses the public Object Storage API
  endpoint objectstorage.<region>.oraclecloud.com (oraclecloud20.com for the OC20
  realm). An unauthenticated GET / returns 404 with a 41-byte JSON error, so the
  response is tiny and no credentials are sent. Each region resolves to its own IP
  (mostly 134.70.x.1 per region). All 45 public regions in the OCI regions table
  (2026-09-27) are covered: 44 in the commercial OC1 realm plus eu-jovanovac-1
  (Serbia, OC20 realm). Regionality was checked by RTT from Helsinki, FI, and it
  matched geography: Stockholm 8 ms, rest of EU 21-62 ms, Israel/Morocco 79-90 ms,
  Middle East 97-159 ms, North America 100-173 ms, India 158-159 ms, Latin America
  157-228 ms, East Asia 211-299 ms, Australia 360-396 ms. eu-madrid-3 is slower than
  eu-madrid-1 (89 vs 61 ms) but still clearly in Europe. Four more hosts resolve and
  answer the same way (us-saltlake-2, us-dallas-1, ap-delhi-1, ap-kulai-1). They are
  left out because they are not in the public regions list and are probably
  dedicated or partner regions. One GET per 15 s is negligible next to normal SDK
  traffic.
targets:
  - name: OCI-ap-sydney-1
    host: objectstorage.ap-sydney-1.oraclecloud.com
    kinds: [https, tcp, icmp]
    region: ap-sydney-1
    city: Sydney
    country: AU
    geo: oc
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 41
