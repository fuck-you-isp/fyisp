provider: exoscale
display: Exoscale
kind: cloud
category: [storage]
sources:
  - https://community.exoscale.com/platform/dc-zones/
  - https://community.exoscale.com/product/storage/object-storage/quick-start/
notes: >-
  Exoscale publishes no speed-test hosts; each zone is probed via its public Simple Object Storage
  endpoint sos-<zone>.exo.io (documented format). Anonymous GET / returns 403 with a ~110 B XML
  body, which counts as reachable. Covers all 8 zones returned by the public zone list
  https://api-ch-gva-2.exoscale.com/v2/zone (re-checked 2026-09-27); Madrid is announced but not live
  (sos-es-mad-1 does not resolve).
targets:
  - name: Exoscale-ch-gva-2
    host: sos-ch-gva-2.exo.io
    kinds: [tcp]
    region: ch-gva-2
    city: Geneva
    country: CH
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 110
  - name: Exoscale-ch-dk-2
    host: sos-ch-dk-2.exo.io
    kinds: [tcp]
    region: ch-dk-2
    city: Zurich
    country: CH
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 110
  - name: Exoscale-de-fra-1
    host: sos-de-fra-1.exo.io
    kinds: [tcp]
    region: de-fra-1
    city: Frankfurt
    country: DE
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 110
  - name: Exoscale-de-muc-1
    host: sos-de-muc-1.exo.io
    kinds: [tcp]
    region: de-muc-1
    city: Munich
    country: DE
    notes: >-
      ICMP replies run ~24 ms slower than TCP (59 vs 35 ms from Helsinki on 2026-09-27). The extra delay
      appears only on the final hop after net-edge030.muc1.exoscale.net, so it is on the host side.
      Use the tcp/https RTT as the true latency; ICMP is still useful for loss.
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 110
  - name: Exoscale-at-vie-1
    host: sos-at-vie-1.exo.io
    kinds: [tcp]
    region: at-vie-1
    city: Vienna
    country: AT
    geo: eu
