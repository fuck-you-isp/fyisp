provider: exoscale
display: Exoscale
kind: cloud
category: [storage]
sources:
  - https://community.exoscale.com/platform/dc-zones/
  - https://community.exoscale.com/product/storage/object-storage/quick-start/
notes: >-
  Exoscale publishes no speed-test hosts; each zone is probed via its public Simple Object Storage
  endpoint sos-<zone>.exo.io (documented format). Anonymous GET / returns 403 with a ~110 B XML
  body, which counts as reachable. Covers all 8 general-purpose zones; Madrid is announced but not live.
targets:
  - name: Exoscale-ch-gva-2
    host: sos-ch-gva-2.exo.io
    kinds: [https, tcp, icmp]
    region: ch-gva-2
    city: Geneva
    country: CH
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 110
