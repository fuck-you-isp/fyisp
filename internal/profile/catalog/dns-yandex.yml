provider: dns-yandex
display: "Yandex DNS"
kind: dns
category: []
sources:
  - https://dns.yandex.com/
notes: >-
  Anycast resolver 77.88.8.8 with nodes mainly in Russia/CIS; a reference for
  that region (from Helsinki ~60 ms). DoH on the IP works with a valid
  certificate.
targets:
