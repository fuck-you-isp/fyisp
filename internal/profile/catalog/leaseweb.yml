provider: leaseweb
display: Leaseweb
kind: cloud
sources:
  - https://kb.leaseweb.com/kb/network/network-link-speeds/
  - https://www.leaseweb.com/en/about-us/data-centers
  - https://developer.leaseweb.com/docs/
notes: >-
  Official Leaseweb speed-test servers speedtest.<dc>.<cc>.leaseweb.net from the Leaseweb KB (19 DCs).
  They serve HTTP only (TCP 443 refused), so targets use TCP port 80 + ICMP; the https kind is not
  recorded. GET http://<host>/ returns a 302 (145 B). iperf3 on 5201-5210 is for manual tests only.
  Re-checked 2026-09-27: all 19 answer. The KB also links speedtest.lax11.us.leaseweb.net, which is
  NXDOMAIN (LAX-12 is covered). Guessed hosts for other Leaseweb DCs (AMS-10/11, FRA-10, SIN-10/11/12,
  HKG-10, TYO-10, SYD-10, MTL-01, WDC-01, DAL-10..12) do not resolve, so only the KB list is covered.
  Audit 2026-09-27: the data-centres page is a script-rendered app (not machine-readable), so the site
  list was rebuilt from the API docs (VPS locations AMS-01, FRA-01, LAX-12, LON-01, MTL-02, SFO-12,
  SIN-01, SYD-12, TYO-11, WDC-02; AMS-10/11/12 as AMS-01 satellite sites) and from the per-site mirror
  hosts mirror.<site>.<cc>.leaseweb.net (FRA-10, LON-11, WDC-01, DAL-10, SIN-11, HKG-10, TYO-10,
  SYD-10). Every one of those sites is in a metro that already has a speed-test target; the mirrors
  share one IP per metro, so they add no separate measurement. All 19 speed-test hosts are HTTP-only
  (TCP 443 refused), ICMP and TCP 80 had no loss (one echo lost on SYD-12).
targets:
  - name: Leaseweb-AMS-01
    host: speedtest.ams1.nl.leaseweb.net
    kinds: [tcp]
    port: 80
    region: AMS-01
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
