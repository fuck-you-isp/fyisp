provider: aruba
display: Aruba Cloud
kind: cloud
category: [vps, iaas]
sources:
  - https://github.com/Arubacloud/pyArubaCloud#readme
  - https://www.arubacloud.com/infrastructures/
  - https://www.datacenters.com/providers/aruba-cloud
notes: >-
  Aruba Cloud has 8 datacentres in its cloud API: DC1/DC2 Italy (Arezzo), DC3 Czech Republic, DC4
  France, DC5 Germany, DC6 UK, DC7 Italy 3 (Ponte San Pietro/Bergamo), DC8 Poland. No per-DC speedtest
  hosts; each DC has its own API front api.dcN.computing.cloud.it (GET / = 1233 B 403, TCP/HTTPS
  only). Where an Aruba host in the same DC answers ICMP it is used via host_overrides:
  r1-it.storage.cloud.it (Arezzo object storage) and speedtest.aruba.it (Bergamo). Geo-IP matches
  every DC; DC7 is reached via Aruba's Italian backbone.
targets:
  - name: Aruba-dc1-Arezzo
    host: api.dc1.computing.cloud.it
    kinds: [https, tcp, icmp]
    host_overrides:
      icmp: r1-it.storage.cloud.it
    region: dc1
    city: Arezzo
    country: IT
    geo: eu
    anycast: false
    notes: >-
      DC1 Italy 1. ICMP via the Arezzo object-storage host r1-it.storage.cloud.it.
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 1233
  - name: Aruba-dc2-Arezzo
    host: api.dc2.computing.cloud.it
    kinds: [https, tcp]
    region: dc2
    city: Arezzo
    country: IT
    geo: eu
    anycast: false
    notes: >-
      DC2 Italy 2, same campus and /24 as DC1. Legacy Cloud API front api.dcN.computing.cloud.it; GET / is a 1233 B IIS 403; no ICMP
    verified:
      date: 2026-09-27
