provider: ucloud
display: UCloud
kind: cloud
category: [vps, storage]
sources:
  - https://docs.ucloud.cn/api/summary/regionlist
  - https://docs.ucloud.cn/ufile/s3/s3_introduction
notes: >-
  UCloud lists 33 regions (regionlist, 2026-09-27; none closed), and each is probed via its US3/UFile S3
  endpoint s3-<region>.ufileos.com (GET / returns a 204-byte 400). The endpoints return the same
  addresses to every client subnet tested (Chinese Telecom/Unicom, Hong Kong, US, Finland), so there is
  no GeoDNS. Overseas endpoints are on AS135377, and geo-IP matched the city for every one checked;
  mainland addresses all geolocate to UCloud's Shanghai registration, so RTT and the carrier ASN were
  used instead. s3-cn-bj serves cn-bj2 (Beijing 2). uz-tas and mx-mex are not in the S3 endpoint doc but
  answer from Tashkent and Mexico City. cn-bj1, cn-wlcb2, cn-sh (finance cloud), cn-jx, cn-gd2 and
  ph-mnl have no S3 endpoint and are kept with kinds [] (their city may be covered by a sibling region).
  The us-ws region (Washington) geolocates to Washington DC or Ashburn, VA depending on the database.
targets:
  - name: UCloud-cn-bj2
    host: s3-cn-bj.ufileos.com
    kinds: [tcp]
    region: cn-bj2
    city: Beijing
    country: CN
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 400
      bytes: 204
  - name: UCloud-cn-bj1
    host: s3-cn-bj1.ufileos.com
    kinds: []
    region: cn-bj1
    city: Beijing
    country: CN
    geo: as
    anycast: false
    tags: [unreachable]
    notes: no public UFile/US3 S3 endpoint for this region (2026-09-27)
    verified:
      date: 2026-09-27
      icmp: false
      tcp: false
      https: 0
      bytes: 0
