provider: racknerd
display: RackNerd
kind: cloud
category: [vps, bare-metal]
sources:
  - https://www.racknerd.com/datacenters
  - https://lg-ny.racknerd.com/
  - https://my.racknerd.com/index.php?rp=%2Fknowledgebase%2F1%2FDo-you-have-a-looking-glass.html
notes: >-
  Official RackNerd looking-glass hosts lg-<loc>.racknerd.com, one per datacenter; the LG page header
  links 12 (LA DC-03, San Jose, Seattle, Dallas, Chicago, New York, Ashburn, Atlanta, Toronto,
  Strasbourg, Amsterdam, Dublin). GET / is the small LG page; never fetch the test files.
  Older hostnames
  lg-lax02 / lg-lax05 / lg-nj no longer resolve and lg-lax.racknerd.com resolves but does not answer. racknerd.com itself sits behind a Cloudflare challenge.
targets:
  - name: RackNerd-Los-Angeles-DC03
    host: lg-lax03.racknerd.com
    path: /robots.txt
    kinds: [https, tcp, icmp]
    region: lax03
    city: Los Angeles
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 284
