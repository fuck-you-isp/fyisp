# Clouvider's public speed-test servers: iperf3 on ports 5200-5209 (Chicago
# 5201-5209).
provider: clouvider
display: Clouvider
sources:
  - https://github.com/masonr/yet-another-bench-script/blob/master/yabs.sh
  - https://www.clouvider.com/looking-glass/
  - https://iperf3serverlist.net/
notes: >-
  Ports checked open with one TCP connect each (team lead, 2026-10-10; Chicago and Phoenix 2026-10-22).
  Chicago answers on 5201-5209, not 5200. Chicago and Phoenix are listed only on iperf3serverlist.net,
  and both answered an iperf3 handshake.
  capacity_gbps is the link YABS's server list states (yabs.sh IPERF_LOCS labels), where it states one.
servers:
  - {id: Clouvider-London, host: lon.speedtest.clouvider.net, ports: 5200-5209, city: London, country: GB, metro: london, capacity_gbps: 10, geo: eu, verified: {date: 2026-10-10, tcp: true}}
  - {id: Clouvider-Manchester, host: man.speedtest.clouvider.net, ports: 5200-5209, city: Manchester, country: GB, metro: manchester, geo: eu, verified: {date: 2026-10-10, tcp: true}}
