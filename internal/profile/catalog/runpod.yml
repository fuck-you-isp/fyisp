provider: runpod
display: RunPod
kind: cloud
category: [gpu]
sources:
  - https://docs.runpod.io/references/gpu-types https://docs.runpod.io/serverless/storage/s3-api
notes: >-
  RunPod runs GPUs in many Secure Cloud data centers (EU-RO-1, US-KS-2, ...) plus community hosts,
  but publishes no located per-datacenter endpoint: the per-datacenter S3 API hosts
  s3api-<dc>.runpod.io are all Cloudflare anycast fronts. One anycast target: the API host
  api.runpod.io (GET / is a 23-byte 404).
targets:
  - name: RunPod-api
    host: api.runpod.io
    kinds: [https, tcp, icmp]
    path: /
    anycast: true
    notes: Cloudflare anycast
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 23
