provider: china-mobile-ecloud
display: China Mobile eCloud
kind: cloud
category: [iaas, storage]
sources:
  - https://ecloud.10086.cn/
  - https://github.com/rclone/rclone/blob/master/backend/s3/provider/ChinaMobile.yaml
notes: >-
  China Mobile's public cloud. Each resource pool has its own S3-compatible Elastic Object Storage
  (EOS) endpoint eos-<pool>.cmecloud.cn; an anonymous GET / is a 214-byte ListAllMyBuckets
  response. Every pool resolves to a distinct China Mobile (AS9808 and provincial AS) address, and
  geo-IP matched the named city for every one sampled (Suzhou, Beijing, Guangzhou, Chengdu, Xi'an,
  Changchun, Kunming, Changsha, Huainan). Most pools drop ICMP from abroad, so icmp is enabled
  only where replies came back. Pools that are extra capacity in the same city (suzhou-2..4,
  dongguan-2..5, chengdu-2..5 and so on) are left out. eos-qinghai-1 resolves but refused TCP, so
  it is not listed. Expect higher loss than usual on the cross-border path.
targets:
  - name: CMeCloud-wuxi-1
    host: eos-wuxi-1.cmecloud.cn
    kinds: [https, tcp, icmp]
    region: wuxi-1
    city: Suzhou
    country: CN
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 214
