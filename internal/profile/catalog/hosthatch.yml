provider: hosthatch
display: HostHatch
kind: cloud
category: [vps, storage]
sources:
  - https://hosthatch.com/locations
  - https://lg.sgp.hosthatch.com/
notes: >-
  Official HostHatch looking-glass hosts lg.<loc>.hosthatch.com; the location list (id, city,
  facility) is embedded in the LG app's JavaScript (14 locations). GET / is a ~12 KB HTML page;
  never fetch the speed-test files.
targets:
  - name: HostHatch-Amsterdam
    host: lg.ams.hosthatch.com
    path: /api/health
    kinds: [tcp]
    region: ams
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 231
