provider: hosthatch
display: HostHatch
kind: cloud
category: [vps, storage]
sources:
  - https://lg.hosthatch.com/
  - https://hosthatch.com/
notes: >-
  Official per-location looking-glass hosts lg.<loc>.hosthatch.com (AS63473), all 14 listed by the
  lg.hosthatch.com location picker. GET /api/health returns ~230 B of JSON; never fetch the 1GB/5GB
  test files. RTT from Helsinki matched each location. "New York" is Evocative EWR1 (New Jersey side).
targets:
  - name: HostHatch-Amsterdam
    host: lg.ams.hosthatch.com
    kinds: [https, tcp, icmp]
    path: /api/health
    region: ams
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 231
