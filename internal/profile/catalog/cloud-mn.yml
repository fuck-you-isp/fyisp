notes: >-
  Mongolian national cloud run by Intelligent Tools LLC (whois ITOOLSLLC-MN, Ulaanbaatar). Its S3
  object storage s3.cloud.mn returns a 214-byte ListAllMyBuckets response under a valid *.cloud.mn
