provider: ovh
display: OVHcloud
kind: cloud
sources:
  - https://proof.ovh.net/
  - https://docs.ovhcloud.com/en/guides/network/network-tools
  - https://bhs.proof.ovh.ca/
  - https://proof.ovh.us/
  - https://public-cloud.status-ovhcloud.com/api/v2/components.json
notes: >-
  Official OVHcloud "Proof" network speed-test servers <pop>-<dc>.speedtest.network.ovh.net, exactly
  the datacenter list offered by proof.ovh.net (the legacy <dc>.proof.ovh.{net,ca,us} names resolve to
  the same machines). GET / is ~31 KB so path is /robots.txt (223 B). Paris par-a/b/c are the three
  AZs of the eu-west-par 3-AZ region.
  There is no Proof server for Warsaw (WAW), Limburg/Frankfurt (LIM/DE), Toronto (TOR) or Milan
  (waw/lim/fra.proof.ovh.net and guessed *.speedtest.network.ovh.net names do not resolve). Those four
  public-cloud regions are probed in ovh-storage.yml (OVHObj-waw, OVHObj-de, OVHObj-eu-south-mil,
  OVHObj-ca-east-tor: s3.<region>.io.cloud.ovh.net, re-checked 2026-09-27, geo-IP in the named city),
  so they are not duplicated here.
  Gaps: the 33 Public Cloud Local Zones (single-AZ metro sites, listed on the Public Cloud status page)
  publish no per-site endpoint. There is no Proof server or S3 endpoint for them, and the
  compute.<lz>.cloud.ovh.net API names resolve to shared central fronts (bru-a and ams-a share one IP).
  They are listed with kinds: [] and a placeholder host that is never probed.
targets:
  - name: OVH-eu-west-rbx
    host: lil1-rbx.speedtest.network.ovh.net
    kinds: [tcp]
    path: /robots.txt
    region: eu-west-rbx
    city: Roubaix
    country: FR
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 223
