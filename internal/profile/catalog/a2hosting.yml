provider: a2hosting
display: hosting.com (A2 Hosting)
kind: cloud
category: [shared, vps]
sources:
  - https://kb.hosting.com/docs/determining-which-data-center-hosts-your-account
notes: >-
  A2 Hosting (now hosting.com) publishes no speed-test, looking-glass or ping hosts, and its own
  infrastructure names are fronted by Cloudflare or AWS Global Accelerator (anycast). These are the
  shared-hosting servers the hosting.com knowledge base names as examples for each datacenter
  (mi3-ss21, az1-ss100 (written az1.ss100 in the KB), nl1-ss9, sg1-ls8): 4 of 4 A2 locations. GET /
  returns a 163-byte cPanel default page. They are customer-hosting servers, not test hosts, so the
  targets are weak (grade C) and the provider has to accept that. They stay because they are
  stable, tiny, provider-named in the KB, and the only per-datacenter endpoints A2 has. hosting.com
  also advertises VPS in London, Sydney, Mumbai and Frankfurt; those are not A2 datacenters in the KB
  and have no endpoint, so they are not listed.
targets:
  - name: A2Hosting-Michigan
    host: mi3-ss21.a2hosting.com
    kinds: [https, tcp, icmp]
    region: mi
    city: Ann Arbor
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 163
  - name: A2Hosting-Arizona
    host: az1-ss100.a2hosting.com
    kinds: [https, tcp, icmp]
    region: az
    city: Phoenix
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 163
  - name: A2Hosting-Amsterdam
    host: nl1-ss9.a2hosting.com
    kinds: [https, tcp, icmp]
    region: nl
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 163
  - name: A2Hosting-Singapore
    host: sg1-ls8.a2hosting.com
    kinds: [https, tcp, icmp]
    region: sg
    city: Singapore
    country: SG
    geo: as
    anycast: false
    notes: KB-named example server (was the guessed sg1-ss1); RTT from Helsinki ~188 ms fits Singapore
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 163
