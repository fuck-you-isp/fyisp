provider: timeweb-cloud
display: Timeweb Cloud
kind: cloud
category: [vps, storage]
sources:
  - https://timeweb.cloud/docs/nashi-data-centry
  - https://timeweb.cloud/docs/s3-storage/manage-storage/s3-guide
notes: >-
  Timeweb Cloud runs cloud servers in Saint Petersburg, Moscow, Novosibirsk, Almaty, Frankfurt and
  Amsterdam (plus dedicated-only sites). The only published regional public endpoint is its S3 storage
  s3.twcstorage.ru (region ru-1, Saint Petersburg, AS9123; GET / returns a 187-byte bucket list). The
  other locations have no speed-test, looking-glass or regional API host and are not included. RTT from
  Helsinki (~60 ms) is higher than the distance suggests; the route detours.
targets:
  - name: Timeweb-ru-1
    host: s3.twcstorage.ru
    kinds: [https, tcp, icmp]
    region: ru-1
    city: Saint Petersburg
    country: RU
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 187
