provider: wargaming
display: Wargaming (World of Tanks)
kind: game
category: [mmo]
sources:
  - https://forum.worldoftanks.eu/index.php?/topic/260926-ip-address-for-eu1-and-eu2-server/   # community (official forum): ping login.p1.worldoftanks.eu for EU1 etc.
  - https://theglobalgaming.com/gaming/server-location-world-of-tanks                          # community: EU1 Amsterdam, EU2 Luxembourg, NA Chicago
  - https://wargaming.net/support/en/products/wot/article/10196/                               # official connection troubleshooter (firewall ranges 92.223.0.0/16 blocks, no ping hosts)
notes: >-
  World of Tanks login/cluster hosts (login.pN.worldoftanks.eu = EU cluster N,
  wotna3.login.wargaming.net = NA). Pinging the login host of a cluster is
  the community-documented way to compare clusters; Wargaming's support
  pages give only firewall ranges. Hosts answer ICMP only (no TCP/443).
  Hosting: EU1/EU2/EU3/EU4 and NA are Gcore (AS199524) sites; EU5 resolves to
  an AWS eu-central-1 EC2 address. Cities are geo-IP of the resolved address
  (EU1 Amsterdam and NA Chicago also match community lists; EU4 geo-IPs to
  Almaty but answered in ~70 ms from Western Europe, so treat as
  unconfirmed). Login hosts are lobby entry points, not every battle server.
  Lesta's Russian "Mir Tankov" and the Asia cluster are not included.
targets:
  - {name: WoT-EU1, host: login.p1.worldoftanks.eu,   kinds: [icmp], region: EU1, city: Amsterdam,  country: NL, geo: eu, anycast: false, tags: [lobby], verified: {date: 2026-09-27, icmp: true, tcp: false}}
  - {name: WoT-EU2, host: login.p2.worldoftanks.eu,   kinds: [icmp], region: EU2, city: Luxembourg, country: LU, geo: eu, anycast: false, tags: [lobby], verified: {date: 2026-09-27, icmp: true, tcp: false}}
  - {name: WoT-EU3, host: login.p3.worldoftanks.eu,   kinds: [icmp], region: EU3, city: Luxembourg, country: LU, geo: eu, anycast: false, tags: [lobby], verified: {date: 2026-09-27, icmp: true, tcp: false}}
  - {name: WoT-EU4, host: login.p4.worldoftanks.eu,   kinds: [icmp], region: EU4, city: Almaty,     country: KZ, geo: as, anycast: false, tags: [lobby], notes: geo-IP only; unconfirmed, verified: {date: 2026-09-27, icmp: true, tcp: false}}
  - {name: WoT-EU5, host: login.p5.worldoftanks.eu,   kinds: [icmp], region: EU5, city: Frankfurt,  country: DE, geo: eu, anycast: false, tags: [lobby], notes: AWS eu-central-1, verified: {date: 2026-09-27, icmp: true, tcp: false}}
