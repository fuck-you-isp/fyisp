provider: bizfly-cloud
display: BizFly Cloud
kind: cloud
category: [vps, storage]
sources:
  - https://bizflycloud.vn/docs/simple_storage/
  - https://bizflycloud.vn/simple-storage
notes: >-
  BizFly Cloud (VCCorp, Vietnam) regions: Hanoi (HN) and Ho Chi Minh City (HCM). Each is probed via its
  Simple Storage S3 endpoint <region>.ss.bfcplatform.vn; GET / is a 154-byte bucket list. Both are on
  VNPT (AS45899). The HCM address geolocates to northern Vietnam (VNPT geo-IP is coarse), but its RTT is
  lower than Hanoi's.
targets:
  - name: BizFly-HN
    host: hn.ss.bfcplatform.vn
    kinds: [tcp]
    region: HN
    city: Hanoi
    country: VN
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 154
  - name: BizFly-HCM
    host: hcm.ss.bfcplatform.vn
    kinds: [tcp]
    region: HCM
    city: Ho Chi Minh City
    country: VN
    geo: as
    anycast: false
    notes: VNPT geo-IP says northern VN
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 154
