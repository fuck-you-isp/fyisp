provider: interserver
display: InterServer
kind: cloud
category: [vps, bare-metal]
sources:
  - http://speedtest.is.cc/
  - https://www.peeringdb.com/asn/19318
notes: >-
  Official InterServer speed-test hosts, one per datacenter: Secaucus NJ (nyc.speedtest.is.cc) and
  Los Angeles (lax.speedtest.is.cc) (2 of 2). The Secaucus host has TCP 443 open but an invalid TLS
  certificate, and the LA host is HTTP-only (port 80), so both are tcp + icmp only. The HTTP index is
  ~1.2 KB; never fetch the *.img test files.
targets:
  - name: InterServer-Secaucus
    host: nyc.speedtest.is.cc
    kinds: [tcp, icmp]
    region: nj
    city: Secaucus
    country: US
    geo: na
    anycast: false
    notes: TLS certificate invalid on 443; tcp/icmp only
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
  - name: InterServer-LosAngeles
    host: lax.speedtest.is.cc
    kinds: [tcp, icmp]
    port: 80
    region: la
    city: Los Angeles
    country: US
    geo: na
    anycast: false
    notes: HTTP-only (port 80); tcp/icmp only
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
