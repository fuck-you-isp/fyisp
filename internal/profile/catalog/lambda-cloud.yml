provider: lambda-cloud
display: Lambda (GPU cloud)
kind: cloud
category: [gpu]
sources:
  - https://docs.lambda.ai/public-cloud/on-demand/
  - https://docs.lambda.ai/public-cloud/s3-adapter-filesystems/
notes: >-
  Located endpoints are the Filesystem S3 Adapter hosts files.<region>.lambda.ai, which exist only
  for some regions (us-east-2/us-east-3 share one IP in Leesburg VA; us-south-3 Austin TX; us-midwest-2
  Columbus OH, a region not yet on the public region list). They answer TCP 443 with a 181-byte S3
  404 and no ICMP. Other regions have no public per-region endpoint and are listed with kinds: []. The
  cloud dashboard/API cloud.lambda.ai is a Cloudflare anycast front.
targets:
  - name: Lambda-us-east-2
    host: files.us-east-2.lambda.ai
    kinds: [https, tcp]
    region: us-east-2
    city: Washington DC
    country: US
    geo: na
    anycast: false
    notes: also serves us-east-3 (files.us-east-3.lambda.ai resolves to the same IP); IP geolocates to Leesburg VA
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 404
      bytes: 181
  - name: Lambda-us-south-3
    host: files.us-south-3.lambda.ai
    kinds: [https, tcp]
    region: us-south-3
    city: Austin
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 404
      bytes: 181
  - name: Lambda-us-midwest-2
    host: files.us-midwest-2.lambda.ai
    kinds: [https, tcp]
    region: us-midwest-2
