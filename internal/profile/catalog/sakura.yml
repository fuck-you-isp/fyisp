provider: sakura
display: Sakura Internet
kind: cloud
category: [vps, bare-metal, storage]
sources:
  - https://manual.sakura.ad.jp/cloud/support/region-zone.html
  - https://cloud.sakura.ad.jp/news/2025/09/25/campaign-is1c/
  - https://manual.sakura.ad.jp/cloud/objectstorage/about.html
  - https://manual.sakura.ad.jp/cloud/objectstorage/example-aws-cli.html
notes: >-
  Sakura Cloud regions: Ishikari (zones is1a, is1b, is1c) and Tokyo (tk1a, tk1b), plus the tk1v sandbox;
  Sakura VPS and rental servers also run in Osaka. The per-zone cloud APIs all sit behind one host
  (secure.sakura.ad.jp/cloud/zone/<zone>/), so each region is probed via its Object Storage S3 endpoint
  (s3.isk01 = Ishikari site 1, s3.tky01 = Tokyo site 1; GET / is a 174-byte 403). Geo-IP places both in
  Tokyo, but 153.120.0.0/16 is Sakura's Ishikari block and isk01 is ~40 ms farther from Europe than
  tky01. Osaka is probed via the control-panel proxy secure.sakura.ad.jp (AS9371, geolocated to Osaka;
  GET / is a 138-byte redirect).
targets:
  - name: Sakura-is1
    host: s3.isk01.sakurastorage.jp
    kinds: [https, tcp, icmp]
    region: is1
    city: Ishikari
    country: JP
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 174
  - name: Sakura-tk1
    host: s3.tky01.sakurastorage.jp
    kinds: [https, tcp, icmp]
    region: tk1
    city: Tokyo
    country: JP
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 174
  - name: Sakura-Osaka
    host: secure.sakura.ad.jp
    kinds: [https, tcp, icmp]
    region: osaka
    city: Osaka
    country: JP
    geo: as
    anycast: false
    notes: control-panel proxy; Osaka per geo-IP (AS9371)
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 302
      bytes: 138
