provider: tensordock
display: TensorDock
kind: cloud
category: [gpu]
sources:
  - https://marketplace.tensordock.com/
notes: >-
  TensorDock is a GPU marketplace on partner hosts in many countries, with no per-location public
  endpoint. One anycast target: marketplace.tensordock.com behind Cloudflare (GET /robots.txt ~1.2
  KB).
targets:
  - name: TensorDock-marketplace
    host: marketplace.tensordock.com
    kinds: [https, tcp, icmp]
    path: /robots.txt
    anycast: true
    notes: Cloudflare anycast
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 1248
