provider: mythic-beasts
display: Mythic Beasts
kind: cloud
category: [vps, bare-metal]
sources:
  - https://www.mythic-beasts.com/article/infrastructure
  - https://www.mythic-beasts.com/servers/virtual
notes: >-
  Mythic Beasts data centres (infrastructure page, 2026-09-27, which says "seven data centres" but names
  six): London THS (Telehouse South), SOV (Sovereign House), CLL (City Lifeline), Cambridge, Amsterdam
  (Equinix AM5) and Fremont (HE FMT2); VPS zones are London CLL/THS/SOV, Cambridge, Amsterdam and
  Fremont. No speed-test or looking-glass host is published. SOV and Cambridge use the official public
  mirror nodes mirror-<site>-a.mythic-beasts.com (GET /robots.txt is a 333 B 404). CLL uses the per-site
  front of Mythic's public IPv4-to-IPv6 proxy service, cll.proxy.mythic-beasts.com (TCP 443 + ICMP;
  HTTPS is not used because the proxy has no certificate for its own name). Amsterdam uses Mythic's
  authoritative name server ns2.mythic-beasts.com (TCP 53 + ICMP; traceroute ends behind
  infra-ams-c, ~27.6 ms like the other AMS hosts; geo-IP says Cambridge, the registrant). THS has only
  per-site infrastructure hosts (infra-ths-a, resolver-ths-a) that are not public services, so it stays
  ICMP only. Fremont uses the customer resolver resolver-fmt2-a (two A records, both 185.101.97.0/24 in
  FMT2; ICMP only) instead of an edge router, whose control plane may deprioritise echo. There is no
  ths/ams/cam/fmt2 proxy name (NXDOMAIN).
targets:
  - name: MythicBeasts-London-SOV
    host: mirror-sov-a.mythic-beasts.com
    path: /robots.txt
    kinds: [https, tcp, icmp]
    region: sov
    city: London
    country: GB
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 333
  - name: MythicBeasts-London-CLL
    host: cll.proxy.mythic-beasts.com
    kinds: [tcp, icmp]
    region: cll
    city: London
    country: GB
    geo: eu
    anycast: false
    notes: "CLL front of the public IPv4-to-IPv6 proxy (rDNS cll.proxy, path via vds-cll-k); TCP 443 connect only"
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
  - name: MythicBeasts-Cambridge
    host: mirror-cam-a.mythic-beasts.com
    path: /robots.txt
    kinds: [https, tcp, icmp]
    region: cam
    city: Cambridge
    country: GB
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 333
  - name: MythicBeasts-Amsterdam
    host: ns2.mythic-beasts.com
    kinds: [tcp, icmp]
    port: 53
    region: ams
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    notes: "authoritative name server; traceroute ends behind infra-ams-c; TCP 53 connect only"
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
