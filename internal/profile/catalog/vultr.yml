provider: vultr
display: Vultr
kind: cloud
sources:
  - https://www.vultr.com/resources/faq/#downloadspeedtests
  - https://fra-de-ping.vultr.com/
  - https://api.vultr.com/v2/regions
notes: >-
  Official Vultr looking-glass / speed-test hosts <loc>-ping.vultr.com, one per region (the looking-glass
  page links all 33). Region ids come from the public Vultr API /v2/regions. GET / is a ~12 KB HTML
  looking-glass page; never fetch the /vultr.com.100MB.bin or 1000MB test files. Re-audited 2026-09-27:
  the API and the looking-glass page both list the same 33 locations; every host is unicast (one A
  record, same answer for client subnets on six continents, rDNS *.vultrusercontent.com), and 5/5 pings,
  3/3 TCP connects and 3/3 GETs of /robots.txt (404, 146 B) succeeded with RTTs plausible for each city.
targets:
  - name: Vultr-ewr
    host: nj-us-ping.vultr.com
    path: /robots.txt
    kinds: [tcp]
    region: ewr
    city: New Jersey
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 146
