provider: hostzealot
display: HostZealot
kind: cloud
category: [vps, dedicated]
sources:
  - https://lg.hostzealot.com/
  - https://www.hostzealot.com/
notes: >-
  HostZealot (HZ Hosting, AS59711/AS202015/AS201525; Veesp is a sister brand on the same network) lists
  20 locations on its looking glass, each with a published speed-test host
  <loc>-speedtest.lg.hostzealot.com. GET / answers a 615 B speed-test page with a valid certificate; all
  answer ping and TCP 443. Locations were checked with geo-IP and RTT from Helsinki. Three Gulf locations
  (Manama, Dubai, Riyadh) geolocate in-country but answer at the same RTT and via the same last hop as
  Marseille (about 47 ms from Helsinki, physically impossible for the Gulf), so they are kept with
  kinds: []. Brussels shares Amsterdam's /24, geolocates to Amsterdam and answers at Amsterdam's RTT, so
  it is kept with kinds: [] too.
targets:
  - name: HostZealot-Amsterdam
    host: ams-speedtest.lg.hostzealot.com
    kinds: [tcp]
    region: amsnl
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 615
