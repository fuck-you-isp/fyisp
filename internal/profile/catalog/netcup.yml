provider: netcup
display: netcup
kind: cloud
category: [vps, bare-metal]
sources:
  - https://www.netcup.com/en/about-netcup/server-locations
  - https://lg.netcup.net/
notes: >-
  netcup has five locations (NUE, VIE, AMS, MNZ, SIN) but publishes only one self-hosted
  OpenSpeedTest page, speedtest.netcup.de, in Nuremberg (geo-IP Nuremberg, AS197540, ~27 ms from
  Helsinki). GET / is an 8 KB page; never run the test itself. The looking glass lg.netcup.net forbids
  automated use and runs from the routers, so it is not a target. No per-location host was found for
  Vienna, Amsterdam, Manassas or Singapore (DNS guesses and certificate-transparency search), so
  those are listed as unreachable with a placeholder host that is never probed.
targets:
  - name: Netcup-Nuremberg
    host: speedtest.netcup.de
    kinds: [https, tcp, icmp]
    region: nue
    city: Nuremberg
    country: DE
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 8020
  - name: Netcup-Vienna
    host: www.netcup.com
    kinds: []
    region: vie
    city: Vienna
    country: AT
    geo: eu
    anycast: false
    tags: [unreachable]
    notes: >-
      No public per-location endpoint; placeholder host, never probed.
  - name: Netcup-Amsterdam
    host: www.netcup.com
    kinds: []
    region: ams
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    tags: [unreachable]
    notes: >-
      No public per-location endpoint; placeholder host, never probed.
  - name: Netcup-Manassas
    host: www.netcup.com
    kinds: []
    region: mnz
    city: Manassas
    country: US
    geo: na
    anycast: false
    tags: [unreachable]
    notes: >-
      No public per-location endpoint; placeholder host, never probed.
  - name: Netcup-Singapore
    host: www.netcup.com
    kinds: []
    region: sin
    city: Singapore
    country: SG
    geo: as
    anycast: false
    tags: [unreachable]
    notes: >-
      No public per-location endpoint; placeholder host, never probed.
