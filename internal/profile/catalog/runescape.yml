provider: jagex
display: Jagex (Old School RuneScape, RuneScape)
kind: game
category: [mmo]
sources:
  - https://oldschool.runescape.com/slu                        # official world list with per-world country
  - https://oldschool.runescape.wiki/w/Ping_(Server)           # community wiki: "ping oldschool1.runescape.com" (world N+300)
  - https://oldschool.runescape.wiki/w/World                   # community wiki: US East / US West split, BR/SG/JP/ZA worlds
  - https://runescape.wiki/w/Server                            # community wiki: US East consolidated in Washington (2023-02-13)
  - https://secure.runescape.com/m=news/more-worlds-more-power-the-road-to-greater-capacity?oldschool=1   # official: cloud-hosted worlds
notes: >-
  Each game world has a public DNS name (OSRS world W = oldschool<W-300>.runescape.com,
  RS3 world N = world<N>.runescape.com) and the long-standing, community-
  and wiki-documented way to check latency is to ping that name. One world
  per hosting site is listed; worlds on the same site share a /24.
  Jagex-owned sites (AS44521) answer ICMP, TCP/443 and HTTPS; newer OSRS
  worlds in Brazil, Singapore, Japan and South Africa run on AWS EC2 in
  sa-east-1 / ap-southeast-1 / ap-northeast-1 / af-south-1 and drop ICMP
  (tcp+https only). The OSRS world web server returns the ~16.6 KB legacy
  game page for every path (acceptable, < 64 KB); RS3 worlds return a
  179-byte 404. Countries come from the official world list; cities are
  Washington-area (wiki) / geo-IP where marked. World numbers can be
  retired; re-check against the world list when re-verifying.
targets:
  - name: OSRS-US-East
    host: oldschool1.runescape.com
    kinds: [icmp, tcp]
    region: us-east
    city: Ashburn
    country: US
    geo: na
    anycast: false
    tags: [game-server]
    notes: OSRS world 301; Jagex AS44521
    verified: {date: 2026-09-27, icmp: true, tcp: true, https: 200, bytes: 16650}
