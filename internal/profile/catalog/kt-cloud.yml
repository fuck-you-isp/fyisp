provider: kt-cloud
display: KT Cloud
kind: cloud
category: [vps, storage]
sources:
  - https://cloud.kt.com/docs/open-api-guide/g/storage/storage-2/
  - https://github.com/froguin/cloudping.me/pull/41
notes: >-
  KT Cloud (Korea Telecom) has data centres in Seoul (Mokdong), Cheonan and Gimhae, but its public S3
  object storage has a single region endpoint, obj-e-1.ktcloud.com (Seoul, AS4766; GET / is a 218-byte
  403). ICMP is filtered. The zones have no public per-zone endpoints; the legacy Swift proxy
  ssproxy.ucloudbiz.olleh.com is being retired.
targets:
  - name: KTCloud-Seoul
    host: obj-e-1.ktcloud.com
    kinds: [https, tcp]
    region: obj-e-1
    city: Seoul
    country: KR
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 403
      bytes: 218
