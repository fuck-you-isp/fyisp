provider: together
display: Together AI
kind: cloud
category: [gpu]
sources:
  - https://docs.together.ai/reference/
notes: >-
  Together AI serves inference and GPU clusters from undisclosed data centers behind one API;
  api.together.xyz is a Cloudflare anycast front (GET / is a 23-byte 307).
targets:
  - name: Together-api
    host: api.together.xyz
    kinds: [https, tcp, icmp]
    path: /
    anycast: true
    notes: Cloudflare anycast
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 307
      bytes: 23
