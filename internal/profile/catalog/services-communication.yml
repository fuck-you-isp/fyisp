  - https://assets.zoom.us/docs/ipranges/ZoomMeetings.txt
  - https://knowledge.workspace.google.com/admin/meet/prepare-your-network-for-meet-meetings-and-live-streams
  - https://learn.microsoft.com/en-us/microsoft-365/enterprise/urls-and-ip-address-ranges
  - https://learn.microsoft.com/en-us/microsoftteams/microsoft-teams-online-call-flows
  - https://docs.thousandeyes.com/product-documentation/best-practices/monitoring-microsoft-teams
  - https://help.webex.com/article/WBX000028782/Network-Requirements-for-Webex-Teams-Services
  - https://slack.com/help/articles/360001603387-Manage-Slack-connection-issues
  - https://discord.com/developers/docs/events/gateway
  - https://core.telegram.org/api/datacenter
  - https://docs.pyrogram.org/faq/what-are-the-ip-addresses-of-telegram-data-centers
  - https://support.apple.com/en-us/101555
  - https://ip-ranges.amazonaws.com/ip-ranges.json
notes: >-
  Voice/video/chat services. Where the vendor publishes an addressable media or relay host
  it is used: Google Meet's TURN SNI hosts meet.turns.goog / workspace.turns.goog (Meet
  network guide) and Teams Transport Relays worldaz/euaz/usaz.tr.teams.microsoft.com (the
  STUN/TURN relays Teams clients and Microsoft's own network assessment use; UDP 3478 is
  the real media path, fyisp only sees their TCP 443 fallback). Zoom and Webex publish
  media zones only as IP ranges (no host answers probes), so Zoom uses its anycast web
  front and Webex the U2C discovery health ping. Telegram's five MTProto DCs are fixed,
  regional IPs (ICMP + TCP 443). Almost everything else is an anycast/CDN or geo-DNS
  front: that measures the path to the vendor edge nearest you, which is what users
  experience, not a fixed location. Signal, WhatsApp-Chat, Google/Teams media hosts and
  Telegram DCs do not speak HTTP(S) with a public CA on 443, so only TCP/ICMP are
  recorded. Google-Meet keeps default.yml's host (lens.l.google.com, ICMP only);
  default.yml pairs it with host_overrides https/tcp -> meet.google.com, which this schema
  cannot express - Google-Meet-Web covers that. FaceTime relays are not addressable;
  iCloud-Gateway (Apple-operated) is the closest stand-in. Verified from a Hetzner
  Helsinki vantage point on 2026-09-27 with 3 pings, 1 TCP connect and 1 GET per target.
targets:
  # Zoom's own anycast web front (AS30103, ~1 ms from Helsinki); media zones publish only IP
  # ranges. From Helsinki: ping 1 ms / TCP connect 3 ms.
  - name: Zoom
    host: zoom.us
    kinds: [tcp]
    path: /robots.txt
    region: global
    anycast: true
    tags: [voice, video]
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 2005
  # Meet media/TURN front (74.125.250.0/24 Workspace media range); ICMP only - no TCP 443
  # listener. default.yml pairs it with host_overrides https/tcp -> meet.google.com. From
  # Helsinki: ping 1 ms.
  - name: Google-Meet
    host: lens.l.google.com
    kinds: [tcp]
    # lens.l.google.com only answers ping; HTTPS/TCP go to meet.google.com
    # (same as default.yml).
    host_overrides:
      https: meet.google.com
      tcp: meet.google.com
    path: /robots.txt
    region: global
    anycast: true
    tags: [voice, video, media]
    verified:
      date: 2026-09-27
      icmp: true
      tcp: false
  # From Helsinki: ping 1 ms / TCP connect 5 ms.
  - name: Google-Meet-Web
    host: meet.google.com
    kinds: [tcp]
    path: /robots.txt
    region: global
    anycast: true
    tags: [video, signaling]
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 184
