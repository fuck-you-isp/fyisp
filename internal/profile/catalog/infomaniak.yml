provider: infomaniak
display: Infomaniak Public Cloud
kind: cloud
category: [iaas]
sources:
  - https://docs.infomaniak.cloud/
  - https://www.infomaniak.com/en/hosting/public-cloud
notes: >-
  Infomaniak Public Cloud (OpenStack) has two regions: dc3-a (pub1, Geneva) and dc4-a (pub2,
  Winterthur). No public speedtest/looking-glass hosts. The regional OpenStack API front
  api.pubN.infomaniak.cloud answers ICMP and GET / with an empty 302 to Horizon. Both hosts geo-IP to
  Geneva and show identical RTT from Helsinki, so the pub2 front may sit in Geneva.
targets:
  - name: Infomaniak-dc3-a
    host: api.pub1.infomaniak.cloud
    kinds: [https, tcp, icmp]
    region: dc3-a
    city: Geneva
    country: CH
    geo: eu
    anycast: false
    notes: >-
      OpenStack API front for pub1; GET / is an empty 302.
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 302
      bytes: 0
  - name: Infomaniak-dc4-a
    host: api.pub2.infomaniak.cloud
    kinds: [https, tcp, icmp]
    region: dc4-a
    city: Winterthur
    country: CH
    geo: eu
    anycast: false
    notes: >-
      OpenStack API front for pub2; GET / is an empty 302. Suspicious: geo-IP says Geneva and RTT equals pub1, so this front may not be in Winterthur.
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 302
      bytes: 0
