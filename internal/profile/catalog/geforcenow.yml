provider: geforcenow
display: NVIDIA GeForce NOW
kind: gaming-platform
category: [cloud-gaming]
sources:
  - https://prod.cloudmatchbeta.nvidiagrid.net/v2/serverInfo
  - https://nvidia.custhelp.com/app/answers/detail/a_id/5224
  - https://op-ffa.net/regions/
notes: >-
  The GFN client's public, unauthenticated serverInfo document lists every NVIDIA-run
  zone and its regional CloudMatch endpoint (<zone>.cloudmatchbeta.nvidiagrid.net);
  those endpoints live in the zone's datacenter (TCP connect times scale with
  distance), so they are real per-region cloud-gaming references. They drop ICMP;
  GET / returns an 83 B 404. Cities follow NVIDIA/op-ffa region names where known.
  GFN Alliance partner zones (KR, JP SoftBank, etc.) are not in NVIDIA's list and are
  omitted. GFN-global is the geo-routed entry point.
targets:
  - name: GFN-us-california-north
    host: us-california-north.cloudmatchbeta.nvidiagrid.net
    kinds: [https, tcp]
    region: us-california-north
    country: US
    geo: na
    anycast: false
    tags: [cloud-gaming]
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 404
      bytes: 83
