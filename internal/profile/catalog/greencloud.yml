provider: greencloud
display: GreenCloudVPS
kind: cloud
category: [vps]
sources:
  - https://greencloudvps.com/data-centers.php
notes: >-
  GreenCloudVPS publishes one test IPv4 per location on its data-centers page; those IPs are used
  as hosts (no per-location hostnames). Several test IPs are upstream-owned looking-glass boxes
  (WebNX, NetActuate, M247, Nexeon, AS20278) inside the same facility rather than GreenCloud's own
  servers. Mostly HTTP-only: probed on port 80 (tcp/icmp); never fetch the *.test/*.bin files.
targets:
