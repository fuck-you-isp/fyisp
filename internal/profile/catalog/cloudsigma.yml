provider: cloudsigma
display: CloudSigma
kind: cloud
category: [iaas]
sources:
  - https://zrh.cloudsigma.com/api/2.0/locations/
  - https://docs.cloudsigma.com/en/latest/general.html
notes: >-
  CloudSigma (Swiss IaaS) publishes its 14 locations in the public API /api/2.0/locations/, some run
  with partners under their own domains (Cairo: cloudadore.com, Dublin: servecentric.com, Monterrey:
  stratospherecloud.com, Riyadh: cld.v2.sa, Washington DC: alpha3cloud.com). The regular
  <loc>.cloudsigma.com API names sit behind Cloudflare, so the targets are the per-location "direct"
  API hosts that the same list gives as upload_url (direct.<loc>...), which resolve to unicast addresses
  in each location. GET /api/2.0/balance/ answers an empty 401 (/api/2.0/ itself returns a 9 KB
  resource list). Geo-IP agrees with every location (the ZRH id is displayed as Geneva; geo-IP
  Lausanne) and RTTs from Helsinki fit (Frankfurt 21 ms, Geneva 54 ms, Ashburn 106 ms, Riyadh 105 ms,
  Monterrey 165 ms, Tokyo 277 ms, Perth 348 ms).
targets:
  - name: CloudSigma-GVA
    host: direct.gva.cloudsigma.com
    kinds: [tcp]
    path: /api/2.0/balance/
    region: ZRH
    city: Geneva
    country: CH
    geo: eu
    anycast: false
    notes: "location id ZRH, displayed as Geneva"
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 401
      bytes: 0
