provider: nine
display: Nine (nine.ch)
kind: cloud
category: [vps, paas]
sources:
  - https://docs.nine.ch/docs/general/datacenter-locations
notes: >-
  Nine's locations (all in the Zurich area): nine-cz42 (ColoZueri 4.2, Altstetten), nine-es34 (NTT
  Zurich 1, Ruemlang), nine-cz41 (ColoZueri 4.1, closed to new self-service resources) and nine-cz01
  (colocation only, not listed). No speed-test host is published. The targets are the per-location
  object-storage endpoints <loc>.objects.nineapis.ch (GET / answers a 133 B 403; Nine's AS29691, geo-IP
  Zurich; they do not answer ping). es34 also gets ICMP via host_overrides on Nine's package mirror
  mirror.nine.ch (nine-repo02, traceroute ends behind m-r2.es34.nine.ch; no web port open). cz41 has no
  own endpoint and is kept with kinds: [].
targets:
  - name: Nine-cz42
    host: cz42.objects.nineapis.ch
    kinds: [https, tcp]
    region: nine-cz42
    city: Zurich
    country: CH
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 403
      bytes: 133
  - name: Nine-es34
    host: es34.objects.nineapis.ch
    kinds: [https, tcp, icmp]
    host_overrides:
      icmp: mirror.nine.ch
    region: nine-es34
    city: Ruemlang
    country: CH
    geo: eu
    anycast: false
    notes: "ICMP probed on mirror.nine.ch (same DC)"
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 133
  - name: Nine-cz41
    host: cz41.objects.nineapis.ch
    kinds: []
    region: nine-cz41
    city: Zurich
    country: CH
    geo: eu
    anycast: false
    tags: [unreachable]
    notes: "no object storage in cz41 (NXDOMAIN); no other public host found"
    verified:
      date: 2026-09-27
      icmp: false
      tcp: false
      bytes: 0
