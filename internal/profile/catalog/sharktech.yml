provider: sharktech
display: Sharktech
kind: cloud
category: [bare-metal, vps]
sources:
  - https://sharktech.net/looking-glass/
  - https://sharktech.net/data-centers/amsterdam/
notes: >-
  Sharktech (AS46844) runs five data centres: Los Angeles, Las Vegas, Denver, Chicago and Amsterdam.
  The targets are its per-location speed-test hosts speedtest.<city>.sharktech.net (rDNS matches the
  name for ams/chi/den/la; geo-IP and RTT from Helsinki fit each city; Las Vegas geolocates to Los
  Angeles, as Sharktech's LV ranges usually do, but answers ~5 ms faster than LA from here). They
  answer ping only; no web or TCP port is open. The looking-glass hosts <city>.sharktech.net were
  not used: their TLS certificates do not validate, LA refuses TCP and several have customer rDNS.
targets:
  - name: Sharktech-LosAngeles
    host: speedtest.la.sharktech.net
    kinds: [icmp]
    region: la
    city: Los Angeles
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: false
      bytes: 0
