provider: civo
display: Civo
kind: cloud
category: [vps, kubernetes]
sources:
  - https://www.civo.com/docs/overview/regions
  - https://www.civo.com/api/regions
notes: >-
  Civo has no speed-test hosts; each region's S3-compatible object-store endpoint
  objectstore.<region>.civo.com answers GET / unauthenticated with a ~200-byte XML reply. Regions per
  the Civo docs: LON1, FRA1, NYC1, MUM1 (4 of 4; PHX1 no longer listed). objectstore.civo.com (no
  region) currently points at the MUM1 cluster and is not used.
targets:
  - name: Civo-LON1
    host: objectstore.lon1.civo.com
    kinds: [tcp]
    region: LON1
    city: London
    country: GB
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 214
  - name: Civo-FRA1
    host: objectstore.fra1.civo.com
    kinds: [tcp]
    region: FRA1
    city: Frankfurt
    country: DE
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 214
  - name: Civo-NYC1
    host: objectstore.nyc1.civo.com
    kinds: [tcp]
    region: NYC1
    city: New York
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 214
  - name: Civo-MUM1
    host: objectstore.mum1.civo.com
    kinds: [tcp]
    region: MUM1
    city: Mumbai
    country: IN
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 187
