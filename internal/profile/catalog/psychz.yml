provider: psychz
display: Psychz Networks
kind: cloud
category: [bare-metal, vps]
sources:
  - https://www.psychz.net/datacenter.html
  - https://www.psychz.net/network.html
notes: >-
  Official Psychz looking-glass hosts lg.<site>.psychz.net, one per data center, linked as "Test Network"
  from the data-center page (17 sites). Region ids are the site labels used in those host names.
  GET / is a ~40 KB looking-glass page, so the probe uses /robots.txt (a ~300 byte 404).
targets:
  - name: Psychz-lax
    host: lg.lax.psychz.net
    kinds: [https, tcp, icmp]
    path: /robots.txt
    region: lax
    city: Los Angeles
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 292
