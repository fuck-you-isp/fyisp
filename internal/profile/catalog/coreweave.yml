provider: coreweave
display: CoreWeave
kind: cloud
category: [gpu]
sources:
  - https://docs.coreweave.com/platform/regions/all-availability-zones
  - https://docs.coreweave.com/docs/products/storage/object-storage/about
notes: >-
  CoreWeave publishes 60+ availability zones but no per-zone public test hosts; the only located
  unauthenticated endpoints are the legacy object-storage hosts object.<zone>.coreweave.com (ORD1,
  LAS1, LGA1, RNO2) and the AI Object Storage endpoint cwobject.com. None answer ICMP. IPs are in
  CoreWeave AS33425 and geolocate to Chicago, Las Vegas, Weehawken NJ, Sparks NV and Roseland NJ;
  TCP connect times from Helsinki (~100-155 ms) fit. Newer AZs (US-EAST-01A...EU-SOUTH-04A) have no
  public endpoint and are not listed.
targets:
  - name: CoreWeave-ord1
    host: object.ord1.coreweave.com
    kinds: [https, tcp]
    path: /
    region: ORD1
    city: Chicago
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 200
      bytes: 214
  - name: CoreWeave-las1
    host: object.las1.coreweave.com
    kinds: [https, tcp]
    path: /
    region: LAS1
    city: Las Vegas
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 200
      bytes: 214
  - name: CoreWeave-lga1
    host: object.lga1.coreweave.com
    kinds: [https, tcp]
    path: /
    region: LGA1
    city: Weehawken
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 200
      bytes: 214
  - name: CoreWeave-rno2
    host: object.rno2.coreweave.com
    kinds: [tcp]
    region: RNO2
    city: Sparks
    country: US
    geo: na
    anycast: false
    notes: "TLS certificate does not match the host, so TCP only"
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
  - name: CoreWeave-ai-object-storage
    host: cwobject.com
    kinds: [https, tcp]
    path: /
    region: US-EAST
    city: Roseland
    country: US
    geo: na
    anycast: false
    notes: "AI Object Storage global endpoint; IP geolocates to New Jersey, not anycast (TCP ~110 ms)"
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 403
      bytes: 166
