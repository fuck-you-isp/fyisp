provider: epic-games
display: Epic Games (Fortnite)
kind: game
category: [br]
sources:
  - https://www.epicgames.com/help/en-US/c-Category_Fortnite/c-Fortnite_TechnicalSupport/understanding-latency-or-ping-in-fortnite-a000084889   # official: "ping ping-nae.ds.on.epicgames.com -n 50" + per-region hosts (page 403s to bots; content via search index)
  - https://www.epicgames.com/help/c-202300000001636/c-202300000001719/fortnite-latency-and-ping-troubleshooting-a202300000010042                 # official Fortnite latency/ping troubleshooting (same host list)
  - https://gameserverping.net/ping-test/fortnite/   # community: lists the extra per-metro hosts (or/ncal/ia/tx/mx/oh/va/gb/fr/de)
  - https://www.i3d.net/customer-stories/psyonix/    # Rocket League hosting (see notes)
  - https://www.rocketleague.com/news/server-performance-a-letter-from-our-ceo
notes: >-
  Fortnite matchmaking regions. Epic publishes ping-<region>.ds.on.epicgames.com
  hosts in its Fortnite latency support article specifically so players can
  ICMP-ping each matchmaking region; they are Epic QoS/ping beacons running on
  cloud instances (no TCP/443 listener, ICMP only). The 8 matchmaking regions
  (nae/nac/naw/eu/oce/br/asia/me) are official; the per-metro hosts
  (va/oh/tx/ia/or/ncal/mx/gb/fr/de) are community-listed but resolve under the
  same Epic zone and answer ICMP. Hosting per resolved IP (rDNS/ip-ranges, 2026-09-27):
  NA-East = AWS us-east-1, NA-Central = AWS us-east-1 Dallas Local Zone (same
  subnet as ping-tx), NA-West = AWS us-west-1, EU = AWS eu-west-2 (London),
  OCE = AWS ap-southeast-2, BR = AWS sa-east-1, ASIA = AWS ap-northeast-1,
  ME = AWS me-south-1 (Bahrain), Iowa = GCP us-central1, MX = AWS mx-central-1,
  FR = AWS eu-west-3, DE = AWS eu-central-1. The beacon IPs can change; the
  hostnames are stable. Fortnite-ME did not answer ICMP or TCP/443 in our
  check (kept with kinds: [] for completeness). Rocket League (Psyonix, an Epic
  studio) has no published ping hosts: it runs on i3D.net bare metal with burst
  capacity in Google Cloud and AWS (i3D.net customer story); its regions
  (USE, USW, EU, OCE, SAM, ASC, ASM, JPN, ME, SAF, IND) map best to the
  corresponding i3D/AWS/GCP metros, so a Rocket League profile should use
  the cloud catalogs rather than invented endpoints.
