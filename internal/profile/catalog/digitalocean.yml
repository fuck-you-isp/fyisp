provider: digitalocean
display: DigitalOcean
kind: cloud
category: [storage]
sources:
  - https://docs.digitalocean.com/platform/regional-availability/
  - https://docs.digitalocean.com/products/spaces/details/availability/
  - https://www.digitalocean.com/community/questions/how-to-test-digitalocean-speed-and-ping-now
notes: >-
  DigitalOcean retired its speedtest-<dc>.digitalocean.com hosts (all NXDOMAIN on 2026-09-27),
  so each region is probed via its public Spaces (S3) regional endpoint <slug>.digitaloceanspaces.com.
  GET / returns a tiny anonymous S3 XML body (~214 B). RTTs from a single vantage point were consistent
  with each endpoint being in-region (e.g. blr1 ~150 ms vs fra1 ~37 ms from Europe).
  Gaps: nyc1 and nyc2 have no Spaces hostname (NYC Spaces is served from nyc3); legacy ams2/sfo1 have no endpoint.
targets:
  - name: DO-nyc3
    host: nyc3.digitaloceanspaces.com
    kinds: [https, tcp, icmp]
    region: nyc3
    city: New York
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 214
  - name: DO-sfo2
    host: sfo2.digitaloceanspaces.com
    kinds: [https, tcp, icmp]
