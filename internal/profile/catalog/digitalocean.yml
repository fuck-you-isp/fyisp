provider: digitalocean
display: DigitalOcean
kind: cloud
category: [storage]
sources:
  - https://docs.digitalocean.com/platform/regional-availability/
  - https://docs.digitalocean.com/products/spaces/details/availability/
  - https://www.digitalocean.com/community/questions/how-to-test-digitalocean-speed-and-ping-now
notes: >-
  DigitalOcean retired its speedtest-<dc>.digitalocean.com hosts (all NXDOMAIN on 2026-09-27),
  so each region is probed via its public Spaces (S3) regional endpoint <slug>.digitaloceanspaces.com.
  GET / returns a tiny anonymous S3 XML body (~214 B). RTTs from a single vantage point were consistent
  with each endpoint being in-region (e.g. blr1 ~150 ms vs fra1 ~37 ms from Europe).
  Gaps: nyc1 and nyc2 have no Spaces hostname (NYC Spaces is served from nyc3); ams2 and sfo1 are
  legacy datacenters (the regional-availability page lists 16 datacenters plus these two, with resource
  creation restricted) and have no endpoint. These four are kept with kinds: [] on their would-be Spaces
  hostname, which is NXDOMAIN. Re-checked 2026-09-27 against 1.1.1.1 and 8.8.8.8: speedtest-<dc>,
  <dc>.speedtest, speedtest.<dc>, lg-<dc>, <dc>.lg, mirrors-<dc> and <dc>.mirrors under digitalocean.com,
  speedtest-<dc>.do.co and <dc>.do.co are all NXDOMAIN; mirrors.digitalocean.com is a Cloudflare anycast
  front; the Functions API host for nyc1 (faas-nyc1-*.doserverless.co) is also behind Cloudflare, so it
  is not in-region. The only other per-datacenter handles are customer Droplets, managed databases and
  load balancers, which are not acceptable targets.
targets:
  - name: DO-nyc3
    host: nyc3.digitaloceanspaces.com
    kinds: [tcp]
    region: nyc3
    city: New York
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 214
