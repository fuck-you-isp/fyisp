provider: northflank
display: Northflank
kind: cloud
category: [paas]
sources:
  - https://northflank.com/cloud/northflank/regions
notes: >-
  Northflank's managed cloud lists 17 regions (africa-south ... us-west-california) but publishes no
  per-region public host (*.code.run service names are per-deployment). Two targets: the platform API
  api.northflank.com (GCP, IP in London; GET / is 31 bytes) and northflank.com on the Fastly anycast
  edge (GET /robots.txt 158 bytes).
targets:
  - name: Northflank-api
    host: api.northflank.com
    kinds: [https, tcp, icmp]
    region: europe-west2
    city: London
    country: GB
    geo: eu
    anycast: false
    notes: control-plane API; location from IP geolocation and ~37 ms RTT from Helsinki
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 31
  - name: Northflank-web
    host: northflank.com
    kinds: [https, tcp, icmp]
    path: /robots.txt
    anycast: true
    notes: Fastly anycast
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 158
