provider: services-streaming
display: Streaming & Media Services
kind: service
category: [streaming, video, audio]
sources:
  - https://ingest.twitch.tv/ingests
  - https://help.twitch.tv/s/twitch-ingest-recommendation
  - https://ip-ranges.amazonaws.com/ip-ranges.json
  - https://apresolve.spotify.com/
  - https://cloud.google.com/about/locations
  - https://fast.com/
  - https://openconnect.netflix.com/
notes: >-
  Video/music streaming. Front ends (YouTube, Netflix, Twitch, Spotify, Disney+, Prime
  Video, Apple TV/Music) are anycast/CDN and measure the edge path users hit; YouTube's
  /generate_204 is a 0-byte 204. The heavy media caches are per-client and not static:
  YouTube's rrN---sn-* hosts (redirector.googlevideo.com is included as the stable entry)
  and Netflix Open Connect appliances (fast.com hands them out per session with a token),
  so neither can be catalogued. Regional targets that are published and stable: Twitch
  ingest servers from the public ingest list (AWS IVS; region confirmed from ip-
  ranges.json and RTT; RTMPS on 443, so TCP only), and Spotify client access points from
  apresolve.spotify.com (ap-g<gcp-region>; region inferred from the naming and consistent
  with RTT; binary protocol, TCP/ICMP only). Twitch ingest is the uplink path for
  streamers, not viewers. Verified from Hetzner Helsinki on 2026-09-27.
targets:
  # /generate_204 returns 204 with empty body. From Helsinki: ping 1 ms / TCP connect 5 ms.
  - name: YouTube
    host: www.youtube.com
    kinds: [tcp]
    path: /generate_204
    region: global
    anycast: true
    tags: [video, streaming]
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 204
      bytes: 0
  # Video CDN redirector; the actual cache host (rrN---sn-*.googlevideo.com, often an ISP-
  # embedded GGC node) is per-client and not static. From Helsinki: ping 3 ms / TCP connect
  # 5 ms.
  - name: YouTube-Video
    host: redirector.googlevideo.com
    kinds: [tcp]
    path: /generate_204
    region: global
    anycast: true
    tags: [video, streaming]
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 204
      bytes: 0
  # Netflix-operated edge (AS2906). From Helsinki: ping 7 ms / TCP connect 9 ms.
