provider: netlify
display: Netlify
kind: cloud
category: [paas]
sources:
  - https://docs.netlify.com/domains-https/custom-domains/configure-external-dns/
notes: >-
  Netlify has no per-region public host. Two edge fronts: apex-loadbalancer.netlify.com (75.2.60.5,
  AWS Global Accelerator anycast, the documented apex A-record target; GET / is a 50-byte 404) and
  netlify.app, which is GeoDNS to the nearest regional edge (from Helsinki: AWS eu-central-1, no
  ICMP), so its location depends on the resolver.
targets:
  - name: Netlify-apex-lb
    host: apex-loadbalancer.netlify.com
    kinds: [https, tcp, icmp]
    path: /
    anycast: true
    notes: AWS Global Accelerator anycast
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 50
  - name: Netlify-edge
    host: netlify.app
    kinds: [https, tcp]
    path: /
    anycast: true
    notes: "GeoDNS to nearest edge, not anycast; location varies by resolver"
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 301
      bytes: 39
