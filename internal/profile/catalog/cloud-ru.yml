provider: cloud-ru
display: Cloud.ru
kind: cloud
category: [vps, storage]
sources:
  - https://cloud.ru/docs/s3e/ug/index
  - https://cloud.ru/docs
notes: >-
  Cloud.ru (formerly SberCloud) has two platforms, both in the Moscow region: Evolution (object storage
  s3.cloud.ru; GET / is a 170-byte ListAllMyBuckets) and Advanced (Huawei-Cloud based, region
  ru-moscow-1; OBS endpoint obs.ru-moscow-1.hc.sbercloud.ru, GET / is a 298-byte 403). Both geolocate to
  Moscow (AS208677).
targets:
  - name: CloudRu-Evolution
    host: s3.cloud.ru
    kinds: [https, tcp, icmp]
    region: ru-central-1
    city: Moscow
    country: RU
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 170
  - name: CloudRu-ru-moscow-1
    host: obs.ru-moscow-1.hc.sbercloud.ru
    kinds: [https, tcp, icmp]
    region: ru-moscow-1
    city: Moscow
    country: RU
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 298
