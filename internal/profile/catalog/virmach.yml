provider: virmach
display: VirMach
kind: cloud
category: [vps]
sources:
  - https://virmach.com/looking-glass/
  - https://billing.virmach.com/index.php?rp=%2Fknowledgebase%2F11%2FTest-IP-and-Looking-Glass-Locations.html
notes: >-
  Official VirMach looking-glass hosts <loc>.lg.virmach.com. The knowledge-base article lists 16;
  the current looking-glass page features Tokyo, Los Angeles and New York (Secaucus). GET / is the
  small LG page; never fetch the test files. Most LG hosts have an invalid TLS certificate (TCP 443 +
  ICMP only); on 2026-09-27 eight of the 16 did not answer or no longer resolve, and two resolve to
  implausible locations (see per-target notes).
targets:
