    host: am3-speedtest.tools.gcore.com
    kinds: [tcp]
    path: /robots.txt
    region: amsterdam
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 25
