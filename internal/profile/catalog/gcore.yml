provider: gcore
display: Gcore Cloud
kind: cloud
category: [vps, bare-metal, gpu]
sources:
  - https://gcore.com/pricing/cloud
  - https://lgs-speedtest.tools.gcore.com/
  - https://docs.gcore.com/storage/manage-object-storage/s3-service-urls-and-default-region-names
  - https://gcore.com/blog/cloud-detailed-overview-of-core-and-edge-locations
notes: >-
  Gcore Cloud compute regions (region selector on the cloud pricing page, 2026-09-27: Almaty, Amsterdam,
  Baku, Chester, Chicago, Darmstadt, Dubai, Frankfurt-2, Helsinki, Hong Kong, Incheon, Istanbul,
  Johannesburg, Lefdal, London, London-2, Luxembourg(-2/-3), Manassas, Mumbai, Paris-2, Santa Clara,
  Sao Paulo(-2), Sines-2/-3, Singapore, Sydney, Tashkent, Tokyo, Warsaw), one target per metro. Gcore
  has no per-cloud-region ping host; the best located endpoints are the official Gcore speed-test
  servers <code>-speedtest.tools.gcore.com (listed in the speed-test page's server list, on Gcore
  AS199524 in the same metro, geo-IP checked) and the regional S3 endpoints <loc>.storage.gcore.dev
  (GET / answers a ~200 B XML error). Speed-test hosts: probe only /robots.txt (25 B); never the
  speedtest-backend/garbage.php download. Gcore network PoPs that are not cloud regions (New York,
  Los Angeles, Querétaro, Tel Aviv, Cairo, Lagos, ...) are left out; the anycast CDN is in cdn-gcore.
  Regions with no public located endpoint are kept with kinds: [] and a placeholder host.
targets:
  - name: Gcore-Amsterdam
    host: am3-speedtest.tools.gcore.com
    kinds: [https, tcp, icmp]
    path: /robots.txt
    region: amsterdam
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 25
