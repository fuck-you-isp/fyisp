provider: linode-storage
display: "Akamai Cloud (Linode) Object Storage"
kind: cloud
category: [storage]
sources:
  - https://techdocs.akamai.com/cloud-computing/docs/object-storage-product-limits
  - https://techdocs.akamai.com/cloud-computing/docs/access-buckets-and-files-through-urls
  - https://api.linode.com/v4/regions
notes: >-
  Linode Object Storage cluster endpoints <cluster>.linodeobjects.com, one per location (the -1
  cluster; extra -2/-3 clusters in the same location are omitted). The region field is the cluster id;
  the compute region mapping differs for de-fra-1 -> de-fra-2, sg-sin-1 -> sg-sin-2, jp-tyo-1 ->
  jp-tyo-3, in-bom-1 -> in-bom-2. Hostnames are Akamai GTM CNAMEs (akadns.net) but resolve to
  in-region addresses: PTRs name the site (osproxy-*.fra1.de, .sto2.se, ...) and RTTs matched the
  linode speed-test hosts. Anonymous GET / returns 200 (214 B, legacy clusters) or 403 (110 B, newer
  E3 clusters). Complements the linode provider (speed-test hosts).
targets:
  - name: LinodeObj-us-east-1
    host: us-east-1.linodeobjects.com
    kinds: [https, tcp, icmp]
    region: us-east-1
    city: Newark
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 214
