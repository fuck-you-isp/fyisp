provider: blizzard
display: Blizzard (WoW, Overwatch 2, Diablo)
kind: game
category: [mmo, fps]
sources:
  - https://eu.forums.blizzard.com/en/overwatch/t/pingable-middle-east-ip/25196        # community (player post on official forum): per-region ping IPs
  - https://us.forums.blizzard.com/en/wow/t/where-is-the-winmtrtracert-page/1916839     # Blizzard's WinMTR/test-IP support article (27780) no longer published
  - https://ipinfo.io/AS57976                                                           # Blizzard AS57976 prefixes
notes: >-
  Blizzard used to publish per-game test IPs in its WinMTR/traceroute support
  article (id 27780); that page is gone, so the IPs here are the
  community-circulated list (player post on Blizzard's forum), re-checked on
  2026-09-27. Only Blizzard/AWS addresses that answered were given kinds;
  the rest are kept with kinds: [] as known-but-unreachable. 24.105.62.129
  (US Central) is Blizzard AS57976 in Chicago; 185.60.112.157 (EU) is
  AS57976 in the Netherlands (geo-IP Lelystad). 185.60.114.159 is listed by
  the community as "Europe", but geo-IP says Seoul and the TCP connect took
  ~300 ms from Western Europe, so it is recorded as Korea (treat as
  unconfirmed). 54.207.107.12 ("Americas/Brazil") is an AWS sa-east-1 EC2
  address. The TCP/443 listeners do not complete TLS, so only tcp is recorded.
  Overwatch 2 is reported by the community to also host match servers in
  public-cloud regions (unconfirmed by Blizzard); for regions without a Blizzard IP, map Overwatch
  US-West/US-Central/EU/Asia/Middle-East to the nearest GCP/AWS catalog
  regions rather than inventing endpoints.
targets:
  - name: Blizzard-US-Central
    host: 24.105.62.129
    kinds: [icmp]
    region: us-central
    city: Chicago
    country: US
    geo: na
    anycast: false
    tags: [game-server]
    notes: community-sourced test IP (WoW/Overwatch US Central)
    verified: {date: 2026-09-27, icmp: true, tcp: false}
  - name: Blizzard-US-West
    host: 24.105.30.129
    kinds: []
    region: us-west
    country: US
    geo: na
    anycast: false
    tags: [game-server]
    notes: community-sourced test IP; no ICMP/TCP443 reply 2026-09-27
    verified: {date: 2026-09-27, icmp: false, tcp: false}
  - name: Blizzard-EU-NL
    host: 185.60.112.157
    kinds: [icmp]
    region: eu
    city: Lelystad
    country: NL
    geo: eu
    anycast: false
    tags: [game-server]
    notes: community-sourced test IP (Europe); city from geo-IP
    verified: {date: 2026-09-27, icmp: true, tcp: false}
  - name: Blizzard-KR
    host: 185.60.114.159
    kinds: [tcp]
    region: kr
    city: Seoul
    country: KR
    geo: as
    anycast: false
    tags: [game-server]
    notes: listed as Europe by community; geo-IP and ~300 ms TCP RTT from EU indicate Korea
    verified: {date: 2026-09-27, icmp: false, tcp: true, https: tls-failed}
  - name: Blizzard-KR-alt
    host: 211.234.110.1
    kinds: []
    region: kr
    country: KR
    geo: as
    anycast: false
    tags: [game-server]
    notes: community-sourced test IP (Korea); no ICMP/TCP443 reply 2026-09-27
    verified: {date: 2026-09-27, icmp: false, tcp: false}
  - name: Blizzard-TW
    host: 203.66.81.98
    kinds: []
    region: tw
    country: TW
    geo: as
    anycast: false
    tags: [game-server]
    notes: community-sourced test IP (Taiwan); no ICMP/TCP443 reply 2026-09-27
    verified: {date: 2026-09-27, icmp: false, tcp: false}
  - name: Blizzard-BR-AWS
    host: 54.207.107.12
    kinds: [tcp]
    region: sa-east-1
    city: Sao Paulo
    country: BR
    geo: sa
    anycast: false
    tags: [game-server]
    notes: community-sourced "Americas/Brazil" IP; AWS sa-east-1 EC2
    verified: {date: 2026-09-27, icmp: false, tcp: true, https: tls-failed}
