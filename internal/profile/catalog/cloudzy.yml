notes: >-
  Official Cloudzy per-region looking-glass hosts lg-<city>.cloudzy.com as linked from the
  looking-glass page (region ids from the same page). GET / is the LG page; never fetch the
  test files. Tokyo (ap-tyo-1) has no LG link.
