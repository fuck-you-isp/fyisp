provider: latitude
display: Latitude.sh
kind: cloud
category: [bare-metal]
sources:
  - https://www.latitude.sh/locations
  - https://www.latitude.sh/docs/storage/object-storage
notes: >-
  Latitude.sh publishes no per-site speed-test or ping host. lg.latitude.sh is a hyperglass looking glass
  behind Cloudflare that runs queries from Latitude routers; it offers nothing to probe. The endpoints are
  the regional high-performance object-storage S3 APIs objects.<region>.storage.sh (documented format;
  Latitude-owned 152.236.0.0/16, several round-robin IPs per region). An unauthenticated GET / returns a
  tiny S3 error. Such an endpoint exists for NYC, ASH, CHI, LAX2, LON2 and Tokyo (objects.tyo.storage.sh;
  Latitude does not say whether it sits in TYO3 or TYO4, so it is its own Latitude-tyo target). That
  covers 7 of the 26 listed sites counting both Tokyo sites; the other 19 are kept with kinds: [] (no
  objects.<site>.storage.sh name resolves for them, checked against 1.1.1.1 on 2026-09-27).
targets:
  - name: Latitude-ash
    host: objects.ash.storage.sh
    kinds: [tcp]
    region: ASH
    city: Ashburn
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 180
