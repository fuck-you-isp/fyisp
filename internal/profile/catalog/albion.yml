  - {name: Albion-Asia,     host: live02-loginserver.sg.albion.zone,  kinds: [], region: east,   city: Singapore,   country: SG, geo: as, anycast: false, tags: [lobby], verified: {date: 2026-09-27, icmp: false, tcp: false}}
  - {name: Albion-Europe,   host: live03-loginserver.ams.albion.zone, kinds: [], region: europe, city: Amsterdam,   country: NL, geo: eu, anycast: false, tags: [lobby], verified: {date: 2026-09-27, icmp: false, tcp: false}}
