notes: >-
  Albion's three shards each have a regional login server that support
  staff and the community use for tracert/ping. None answered ICMP or
  TCP/443 on 2026-09-27 (ICMP filtered, game traffic is UDP), so all three
  are kept with kinds: [] (known but unprobeable) and are skipped by
  profiles. Map them to cloud catalog targets in the same metros instead:
  Americas = Washington DC area (AWS us-east-1 / Azure eastus), Asia =
  Singapore, Europe = Amsterdam.
targets:
