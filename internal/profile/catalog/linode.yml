provider: linode
display: Akamai Cloud (Linode)
kind: cloud
sources:
  - https://www.akamai.com/cloud/speed-test
  - https://www.linode.com/speed-test/
  - https://api.linode.com/v4/regions
notes: >-
  Official Akamai Cloud (Linode) speed-test hosts, one per core compute region, as listed on the
  Akamai Cloud speed-test page (31 locations incl. the 'expansion' sites de-fra-2, gb-lon, in-bom-2,
  sg-sin-2, jp-tyo-3). GET / is a ~12.7 KB HTML page listing test files; never fetch the 100MB/1GB files.
  Region ids are Linode API region slugs (mapped from the page's city names).
  The public API (api.linode.com/v4/regions) lists 33 core regions on 2026-09-27; the two not on the
  speed-test page, us-iad-2 (Washington 2) and fr-par-2 (Paris 2), answer on <slug>.speedtest.linode.com
  (rDNS speedtest-1.iad5.us / speedtest-1.par4.fr.prod.linode.com), so all 33 are covered.
  Gaps: distributed/edge compute sites have no published speed-test host.
targets:
  - name: Linode-us-southeast
    host: speedtest.atlanta.linode.com
    path: /robots.txt
    kinds: [https, tcp, icmp]
    region: us-southeast
    city: Atlanta
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 162
