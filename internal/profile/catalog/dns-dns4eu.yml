notes: >-
  EU-funded public resolver (live since 2025-06-09), operated by Whalebone on
  nodes in 14+ EU member states interconnected via anycast; 'nearest edge' is
  only meaningful inside Europe, elsewhere expect a European PoP. Protective
  variant (86.54.11.1) listed.
targets:
