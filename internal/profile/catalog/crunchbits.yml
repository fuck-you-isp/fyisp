provider: crunchbits
display: Crunchbits (Synteq)
kind: cloud
category: [vps, bare-metal, gpu]
sources:
  - https://synteq.com/looking-glass
  - https://lg-spo.synteq.com/
notes: >-
  Crunchbits rebranded as Synteq. Official looking-glass hosts lg-<loc>.synteq.com; the storefront
  lists 5 locations (chi, dfw, sof, spo, vfo). GET / is the small LG page; never fetch /files/*.
  lg-chi.synteq.com does not resolve. The old lg-cda.crunchbits.com (Coeur d'Alene) now sits
  behind Cloudflare and is not used.
targets:
  - name: Crunchbits-Spokane
    host: lg-spo.synteq.com
    kinds: [tcp]
    region: spo
    city: Spokane
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 57
