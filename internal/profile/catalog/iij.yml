provider: iij
display: IIJ
kind: cloud
category: [vps, storage]
sources:
  - https://www.iij.ad.jp/news/pressrelease/2019/0731.html
  - https://www.iij.ad.jp/biz/storage/
notes: >-
  IIJ (Internet Initiative Japan) runs IIJ GIO and IIJ Object Storage in East (Tokyo area) and West
  (Osaka area) Japan regions, but their endpoints are not published without a contract. As a Tokyo
  proxy, fyisp probes IIJ's public mirror ftp.iij.ad.jp (AS2497, Tokyo; GET / is a 669-byte index). No
  public West-Japan endpoint was found.
targets:
  - name: IIJ-Tokyo
    host: ftp.iij.ad.jp
    kinds: [https, tcp, icmp]
    region: jp-east
    city: Tokyo
    country: JP
    geo: as
    anycast: false
    notes: "IIJ public mirror (AS2497), a Tokyo backbone proxy, not a GIO API endpoint"
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 669
