provider: upcloud
display: UpCloud
kind: cloud
category: [vps]
sources:
  - https://upcloud.com/data-centres
  - https://developers.upcloud.com/1.3/5-zones/
  - https://ring.nlnog.net/
  - https://status.upcloud.com/api/v2/components.json
notes: >-
  UpCloud runs an NLNOG RING measurement node in every zone, published as <zone>.ping.upcloud.com
  (reverse DNS <ip>.<zone>.upcloud.host confirms the zone; RTTs from Helsinki fit every city). These
  nodes exist for latency measurement. They answer ICMP and TCP 80 (nginx 301 to ring.nlnog.net,
  162 B) but have no TLS listener, so only tcp (port 80) and icmp are probed. All 15 public zones.
targets:
  - name: UpCloud-fi-hel1
    host: fi-hel1.ping.upcloud.com
    kinds: [tcp]
    port: 80
    region: fi-hel1
    city: Helsinki
    country: FI
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      http: 301
      bytes: 162
