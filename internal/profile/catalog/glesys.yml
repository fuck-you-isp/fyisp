provider: glesys
display: Glesys
kind: cloud
category: [vps, storage]
sources:
  - https://glesys.com/pricing/
  - https://glesys.com/locations/our-data-centers/falkenberg/
notes: >-
  Glesys (Sweden) runs its own data centres in Falkenberg and Stockholm (Sweden) and Oulu, Pori and
  Tampere (Finland); cloud products are sold in Falkenberg and Stockholm, some also in Oulu. The
  Amsterdam, Frankfurt, London and Oslo "partner data centres" are colocation/PoP sites and are not
  listed. No speed-test or looking-glass host is published. Falkenberg and Stockholm use the per-DC
  object-storage endpoints objects.dc-<fbg1|sto1>.glesys.net (GET / is a 187 B anonymous bucket list;
  answer ping); RTT from Helsinki ~16 ms (Falkenberg) and ~7 ms (Stockholm) fits the locations. No
  public host could be tied to the Finnish sites, so they are kept with kinds: [].
targets:
  - name: Glesys-Falkenberg
    host: objects.dc-fbg1.glesys.net
    kinds: [https, tcp, icmp]
    region: dc-fbg1
    city: Falkenberg
    country: SE
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 187
  - name: Glesys-Stockholm
    host: objects.dc-sto1.glesys.net
    kinds: [https, tcp, icmp]
    region: dc-sto1
