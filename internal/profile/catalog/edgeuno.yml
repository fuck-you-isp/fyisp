provider: edgeuno
display: EdgeUno
kind: cloud
category: [bare-metal, edge]
sources:
  - https://edgeuno.com/locations/
  - https://lg.edgeuno.com/
notes: >-
  EdgeUno (AS7195) runs bare-metal/edge sites across Latin America plus a few in the US, Europe and
  Turkey (edgeuno.com/locations; Seattle is "coming soon" and not listed here). Bogota uses EdgeUno's published speed-test host speedtest.bog.edgeuno.com (/robots.txt answers a
  16 B 404); speedtest.lim/mia exist but give a 502 or an invalid certificate, so Lima and Miami use
  the stats hosts behind them. The other sites have no published speed-test name, so they use the same per-site
  speed-test/stats servers under the naming EdgeUno gives them, stats.<site>.edgeuno.net
  (speedtest.bog/lim/mia resolve to stats.bog/lim1/mia1 servers; valid TLS; /robots.txt answers a
  146-162 B 403 or a 26 B 200). All are unicast in EdgeUno's 200.25.0.0/16 or 76.72.x ranges;
  geo-IP and RTT from Helsinki fit each city. Vinhedo (VCP2) has no stats host and is kept with
  kinds: []. speedtest.nyc/stats.nyc1 are dead; New York uses stats.jfk1.
targets:
  - name: EdgeUno-BuenosAires
    host: stats.eze1.edgeuno.net
    kinds: [tcp]
    path: /robots.txt
    region: eze1
    city: Buenos Aires
    country: AR
    geo: sa
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 146
