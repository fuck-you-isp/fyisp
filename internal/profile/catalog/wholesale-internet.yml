notes: >-
  WholeSale Internet (AS32097) and its budget brand NOCIX sell dedicated servers from a single data
  centre at 1102 Grand, Kansas City, Missouri. The target is NOCIX's speed-test host
  speedtest.nocix.net (rDNS 200g-speedtest.nocix.net, AS32097, geo-IP Kansas City, 129 ms from
  Helsinki). GET /robots.txt answers a 162 B 404. Both websites block non-browser clients.
