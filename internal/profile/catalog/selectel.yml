provider: selectel
display: Selectel
kind: cloud
category: [vps, bare-metal, storage]
sources:
  - https://docs.selectel.ru/en/infrastructure/locations/
  - https://docs.selectel.ru/en/control-panel-actions/availability-matrix/
  - https://docs.selectel.ru/en/s3/manage/configure-storage-update/
  - https://selectel.ru/speedtest
notes: >-
  Selectel locations: Saint Petersburg (pools ru-1, ru-3, ru-9), Moscow (ru-2, ru-6, ru-7, gis-1),
  Novosibirsk (ru-8), Tashkent (uz-1, uz-2), Almaty (kz-1) and Nairobi (ke-1). Official speed-test host
  speedtest.selectel.ru (Saint Petersburg; GET / is a 162-byte redirect, never fetch the test files).
  Other pools are probed via their S3 endpoints s3.<pool>.storage.selcloud.ru (Russia) and
  s3.<pool>.srvstorage.<cc> (Kazakhstan/Uzbekistan, the Servercore international brand), which answer
  GET / with a 192-byte 403. Novosibirsk (ru-8) has no S3 pool; its regional OpenStack API
  ru-8.cloud.api.selcloud.ru geolocates to Novosibirsk and returns 13 bytes. The other
  <pool>.cloud.api.selcloud.ru hosts all resolve to one Moscow /24 and are not used. ru-1 and ru-3 S3
  front ends share one Saint Petersburg /24. Pools ru-2, ru-6, ru-9 and uz-1 have no own public
  endpoint; their cities are covered. Nairobi (ke-1) has no public endpoint found.
targets:
  - name: Selectel-SPb-speedtest
    host: speedtest.selectel.ru
    kinds: [https, tcp, icmp]
    region: ru-1
    city: Saint Petersburg
    country: RU
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 301
      bytes: 162
