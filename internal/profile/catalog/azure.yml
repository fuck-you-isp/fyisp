provider: azure
display: Microsoft Azure
kind: hyperscaler
category: []
sources:
  - https://learn.microsoft.com/en-us/azure/reliability/regions-list
  - https://www.microsoft.com/en-us/download/details.aspx?id=56519
  - https://learn.microsoft.com/en-us/troubleshoot/azure/azure-monitor/app-insights/telemetry/java-standalone-troubleshoot
  - https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/azure-monitor-network-access
  - https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-network-configuration
  - https://learn.microsoft.com/en-us/azure/azure-government/documentation-government-welcome
  - https://learn.microsoft.com/en-us/azure/china/overview-regions
  - https://azurelook.com/azure-update/retirement-microsoft-azure-operated-by-21vianet-action-required-to-migrate-to-azure-china-north-3-region-by-july-1-2026-due-to-china-north-1-and-china-east-1-region-retirement/
notes: >-
  Azure publishes no per-region ping host or official speed-test storage
  accounts (azurespeed.com uses its own third-party storage accounts), so each
  region uses a Microsoft-owned regional ingestion endpoint with an
  unauthenticated health path. Primary: Application Insights regional
  ingestion, <region>.in.applicationinsights.azure.com, GET /api/ping -> 200
  "alive" (5 bytes). Microsoft's App Insights troubleshooting docs use
  /api/ping on the ingestion host as the connectivity check, and the Azure
  Monitor network-access docs list the regional ingestion hosts. It resolves
  through gig-ai-prod-<region>.trafficmanager.net to one or two in-region IPs.
  On 2026-09-27 every host was resolved through 8.8.8.8 with five different
  EDNS client subnets (EU, US, South America, Asia, Africa), and every IP
  returned was inside that same region's AzureCloud.<region> prefixes in the
  published Service Tags file (Gov and China files for those clouds), so the
  hosts are not GeoDNS or globally fronted. West India has no App Insights
  host (NXDOMAIN). Its AMA handler (westindia.handler.control.monitor.azure.com)
  turned out to be weighted about 50/50 between West India and South India, so
  it now uses the Azure Monitor Logs ingestion front
  westindia.prod.hot.ingest.monitor.core.windows.net (GET / -> 404, empty body;
  valid *.prod.hot.ingest.monitor.core.windows.net certificate; always a
  westindia IP). That host is not documented for this purpose. All 57 regions
  in the Microsoft Learn regions list (2026-09-23) are covered, including the
  restricted-access ones (tagged restricted-access). Seven more restricted
  regions appear in the Service Tags file and were added: Sweden South (named
  as Sweden Central's pair in the Learn list), Israel Northwest, Jio India West,
  Jio India Central, Taiwan North and Taiwan Northwest (App Insights hosts,
  in-region), and Malaysia South (kinds: [], no in-region host). Their cities
  are the commonly reported sites, not official. Other Service Tags regions
  are left out as internal, canary or staging: eastus2euap, centraluseuap,
  usstagee, usstagec, eastus3, northeastus5, southeastus, southeastus3,
  southeastus5, southcentralus2, southwestus, northeurope2 and brazilne; none
  has an App Insights host and none is offered to customers.
  Regionality was also checked by RTT from Helsinki, FI, which matched
  geography: EU 26-50 ms, Middle East 91-121 ms, North America 115-170 ms,
  India 140-163 ms, Brazil/Chile 213-220 ms, East Asia 178-261 ms,
  Australia/NZ 282-308 ms. Endpoints we tried and rejected:
  <region>.api.cognitive.microsoft.com (39/57 regions),
  <region>.monitoring.azure.com (westindia resolves to Central India), and the
  third-party azurespeed.com storage accounts, which are not Microsoft-owned.
  Microsoft Dev Tunnels relays (<id>.rel.tunnels.api.visualstudio.com) are also
  Azure-hosted and regional. They stay in default.yml as DevTunnel-* and are not
  duplicated here. The health responses are uncached; one GET every 15 s per
  region is negligible next to normal SDK and agent traffic.
  City is Microsoft's published physical location, narrowed to the best-known
  city where Microsoft gives only a state or country (US regions,
  Israel, Norway). The US cities are not officially published.
  Sovereign clouds (separate accounts, public endpoints) are included and
  tagged restricted. Azure Government: usgovvirginia, usgovtexas and
  usgovarizona use <region>.in.applicationinsights.azure.us /api/ping (5 B,
  148-166 ms). US DoD East and US DoD Central have no App Insights host and
  their handler hosts CNAME into the usgovvirginia / usgovtexas clusters, so
  they are kept with kinds: [] and tagged unreachable. Azure China (21Vianet):
  chinanorth3, chinaeast2 and chinaeast3 use <region>.in.applicationinsights.azure.cn
  /api/ping; chinanorth2 has no App Insights host and uses
  chinanorth2.handler.control.monitor.azure.cn /ping (CNAME in
  *.chinanorth2.cloudapp.chinacloudapi.cn, always a chinanorth2 IP); RTT
  212-251 ms, also tagged mainland-china. China North 1 and China East 1 still
  answer but were retired on 2026-07-01, so they are left out. Azure
  Government and China cities are the commonly reported sites, not official.
targets:
