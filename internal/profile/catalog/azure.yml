provider: azure
display: Microsoft Azure
kind: hyperscaler
category: []
sources:
  - https://learn.microsoft.com/en-us/azure/reliability/regions-list
  - https://learn.microsoft.com/en-us/troubleshoot/azure/azure-monitor/app-insights/telemetry/java-standalone-troubleshoot
  - https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/azure-monitor-network-access
  - https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-network-configuration
notes: >-
  Azure publishes no per-region ping host, so each region uses a Microsoft-owned
  regional ingestion endpoint that has an unauthenticated health path. Primary:
  Application Insights regional ingestion, <region>.in.applicationinsights.azure.com,
  GET /api/ping -> 200 "alive" (5 bytes). Microsoft's App Insights troubleshooting
  docs use /api/ping on the ingestion host as the connectivity check, and the
  Azure Monitor network-access docs list the regional ingestion hosts. It resolves
  through gig-ai-prod-<region>.trafficmanager.net to a single in-region IP.
  West India has no App Insights ingestion host (NXDOMAIN), so it uses the Azure
  Monitor Agent regional control endpoint, westindia.handler.control.monitor.azure.com,
  GET /ping -> 200 "Healthy" (7 bytes). That host is listed in the AMA firewall
  docs as <region>.handler.control.monitor.azure.com and CNAMEs to
  *.westindia.cloudapp.azure.com. All 57 public regions in the Microsoft Learn
  regions list (2026-09-23) are covered, including the restricted-access ones
  (tagged restricted-access). Regionality was checked by DNS (region-named
  Traffic Manager or cloudapp CNAME) and by RTT from Helsinki, FI, which matched
  geography: EU 29-50 ms, Middle East 93-120 ms, North America 114-170 ms,
  India 144-160 ms, Brazil/Chile 212-220 ms, East Asia 180-260 ms,
  Australia/NZ 280-306 ms. Endpoints we tried and rejected: <region>.api.cognitive.microsoft.com
  (39/57 regions, no health path), <region>.monitoring.azure.com (47/57, 404 only),
  and the third-party azurespeed.com storage accounts, which are not Microsoft-owned.
  Microsoft Dev Tunnels relays (<id>.rel.tunnels.api.visualstudio.com) are also
  Azure-hosted and regional. They stay in default.yml as DevTunnel-* and are not
  duplicated here. The /api/ping and /ping responses are uncached health checks;
  one GET every 15 s per region is negligible next to normal SDK and agent traffic.
  City is Microsoft's published physical location, narrowed to the best-known
  city where Microsoft gives only a state or country (US regions,
  Israel, Norway). The US cities are not officially published.
targets:
  # Nearest healthy AMA control region, chosen by Traffic Manager DNS (not
  # anycast). From Helsinki it resolved to germanywestcentral.
  - name: Azure-global
    host: global.handler.control.monitor.azure.com
    kinds: [https, tcp, icmp]
    path: /ping
    anycast: true
    tags: [global, azure-monitor-agent]
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 7
  - name: Azure-australiacentral
    host: australiacentral.in.applicationinsights.azure.com
    kinds: [https, tcp, icmp]
