    host: global.handler.control.monitor.azure.com
    kinds: [https, tcp, icmp]
    path: /ping
    anycast: true
    tags: [global, azure-monitor-agent]
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 7
