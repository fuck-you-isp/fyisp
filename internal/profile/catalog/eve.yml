provider: eve-online
display: EVE Online (CCP)
kind: game
category: [mmo]
sources:
  - https://support.eveonline.com/hc/en-us/articles/5885131953564-Network-Diagnostics   # official network diagnostics (tests against tranquility.servers.eveonline.com)
  - https://theglobalgaming.com/gaming/server-locations-eve-online                     # community: Tranquility cluster in London
notes: >-
  EVE is a single-shard game: Tranquility (the global cluster, physically in
  London per community sources) is reached via tranquility.servers.eveonline.com,
  which resolves to a Cloudflare Spectrum anycast address (172.65.0.0/16).
  Probing it therefore measures the path to the nearest Cloudflare edge, not
  to London, so it is marked anycast and is only a reachability check of
  EVE's front door. Only ICMP is recorded: TCP/443 accepts but is reset (the
  game port is 26000, not probed). For London latency use the London
  targets of the cloud catalogs. Serenity (China) is not included.
targets:
  - name: EVE-Tranquility
    host: tranquility.servers.eveonline.com
    kinds: [icmp]
    region: tranquility
    city: London
    country: GB
    anycast: true
    tags: [game-server]
    notes: Cloudflare Spectrum anycast front; origin cluster in London
    verified: {date: 2026-09-27, icmp: true, tcp: true, https: reset}
