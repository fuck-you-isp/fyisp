provider: fdcservers
display: FDC Servers
kind: cloud
category: [bare-metal]
sources:
  - https://fdcservers.net/locations
  - https://fdcservers.net/lg
notes: >-
  FDC Servers (AS30058) lists 25 dedicated-server locations; its looking-glass page publishes one
  lg-<code>.fdcservers.net host per location, and those are the targets. Each is a unicast address
  in FDC's own ranges (Moscow sits on a Vimpelcom range, as FDC's Moscow PoP does); geo-IP and RTT
  from Helsinki match every city (e.g. lg-spb is Sao Paulo at 229 ms, not St Petersburg). GET /
  answers a 0-byte 302 to fdcservers.net/lg (redirect is not followed). All answer ping.
targets:
  - name: FDC-Amsterdam
    host: lg-ams.fdcservers.net
    kinds: [https, tcp, icmp]
    region: ams
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 302
      bytes: 0
  - name: FDC-Ashburn
    host: lg-iad.fdcservers.net
