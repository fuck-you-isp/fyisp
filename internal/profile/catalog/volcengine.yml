provider: volcengine
display: Volcano Engine
kind: cloud
category: [vps, storage]
sources:
  - https://www.volcengine.com/docs/6349/107356
  - https://docs.volcengine.com/docs/TorchObjectStorage/Regionsandendpoints?lang=zh
notes: >-
  Volcano Engine (ByteDance, mainland China) regions: cn-beijing (North China 2, Beijing), cn-shanghai
  (East China 2) and cn-guangzhou (South China 1). Each is probed via its TOS object-storage endpoint
  tos-<region>.volces.com; GET / returns a ~216-byte 403. The overseas regions (cn-hongkong,
  ap-southeast-1 Johor, ap-southeast-3 Jakarta) use the same infrastructure as BytePlus and are in
  byteplus.yml. Geo-IP: Beijing = Beijing; Shanghai = Jiangsu (Nanjing) addresses, as is common for East
  China multi-line IDCs; Guangzhou = China Mobile addresses geolocated to Xiamen (Fujian); Chinese
  geo-IP is coarse. The GSLB returns several multi-carrier addresses. cn-beijing2 / cn-wulanchabu
  resolve to one Langfang address and are not included because their mapping is not documented.
targets:
  - name: Volcengine-cn-beijing
    host: tos-cn-beijing.volces.com
    kinds: [https, tcp, icmp]
    region: cn-beijing
    city: Beijing
    country: CN
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 216
  - name: Volcengine-cn-shanghai
    host: tos-cn-shanghai.volces.com
    kinds: [https, tcp, icmp]
    region: cn-shanghai
    city: Shanghai
    country: CN
    geo: as
    anycast: false
    notes: geo-IP Nanjing (Jiangsu)
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 213
  - name: Volcengine-cn-guangzhou
    host: tos-cn-guangzhou.volces.com
    kinds: [https, tcp, icmp]
    region: cn-guangzhou
    city: Guangzhou
    country: CN
    geo: as
    anycast: false
    notes: geo-IP Xiamen (China Mobile)
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 216
