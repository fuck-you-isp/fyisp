provider: tilaa
display: Tilaa
kind: cloud
category: [vps]
sources:
  - https://support.tilaa.com/hc/en-us/articles/228651187-Data-Center-Locations-Specifications
notes: >-
  Tilaa runs two data centres, Haarlem (Iron Mountain AMS-1) and Amsterdam (NorthC Kabelweg). No
  speed-test host is published. Haarlem uses api.tilaa.com (Tilaa's own AS196752; GET / answers a 48 B
  404; traceroute ends behind hlm1-pod8.tilaa.net, i.e. Haarlem). mirror.tilaa.nl, www.tilaa.com and
  ns1.tilaa.nl are also in hlm1. Amsterdam uses Tilaa's authoritative name server ns2.tilaa.nl
  (traceroute ends behind ams1-pod3-vc3-v1046.tilaa.net; AS196752, geo-IP says Lelystad, the
  registrant): TCP 53 + ICMP only. The support article is behind a browser challenge; re-checked
  2026-09-27 via the router names (hlm1, ams1) that only these two sites exist.
targets:
  - name: Tilaa-Haarlem
    host: api.tilaa.com
    kinds: [tcp]
    region: hlm1
    city: Haarlem
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 48
  - name: Tilaa-Amsterdam
    host: ns2.tilaa.nl
    kinds: [tcp]
    port: 53
    region: ams
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    notes: "authoritative name server; traceroute ends behind ams1-pod3 (Amsterdam DC); TCP 53 connect only"
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
