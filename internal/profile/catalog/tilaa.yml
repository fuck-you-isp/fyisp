provider: tilaa
display: Tilaa
kind: cloud
category: [vps]
sources:
  - https://support.tilaa.com/hc/en-us/articles/228651187-Data-Center-Locations-Specifications
notes: >-
  Tilaa runs two data centres, Haarlem (Iron Mountain AMS-1) and Amsterdam (NorthC Kabelweg). No
  speed-test host is published. Haarlem uses api.tilaa.com (Tilaa's own AS196752; GET / answers a 48 B
  404; traceroute ends behind hlm1-pod8.tilaa.net, i.e. Haarlem). No public host could be tied to the
  Amsterdam site (mirror.tilaa.nl and www.tilaa.com are also in hlm1), so Amsterdam is kept with
  kinds: [] and a placeholder host.
targets:
  - name: Tilaa-Haarlem
    host: api.tilaa.com
    kinds: [https, tcp, icmp]
    region: hlm1
    city: Haarlem
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 48
  - name: Tilaa-Amsterdam
    host: api.tilaa.com
    kinds: []
    region: ams
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    tags: [unreachable]
    notes: "no public host located in the Amsterdam DC found; placeholder host (api.tilaa.com is in Haarlem)"
    verified:
      date: 2026-09-27
      icmp: false
      tcp: false
      bytes: 0
