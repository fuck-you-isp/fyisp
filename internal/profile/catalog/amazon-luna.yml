provider: amazon-luna
display: Amazon Luna
kind: gaming-platform
category: [cloud-gaming]
sources:
  - https://luna.amazon.com/
notes: >-
  Luna publishes no regional stream/ping hosts (sessions are allocated after login).
  Only the CloudFront web front (anycast) is probed; robots.txt is 58 B.
targets:
  - name: Luna-web
    host: luna.amazon.com
    kinds: [https, tcp, icmp]
    path: /robots.txt
    region: global
    country: US
    geo: na
    anycast: true
    tags: [cloud-gaming]
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 58
