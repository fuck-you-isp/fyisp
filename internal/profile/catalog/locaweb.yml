provider: locaweb
display: Locaweb
kind: cloud
category: [vps, storage]
sources:
  - https://www.locaweb.com.br/locaweb-cloud/
  - https://sources.locaweb.com.br/site/downloads/proposta-comercial-object-storage.pdf
notes: >-
  Locaweb (Brazil) runs its cloud and Object Storage from Sao Paulo only. The Object Storage endpoint
  s3.locaweb.com.br (AS27715, geo-IP Sao Paulo) accepts TCP 443 but aborts every TLS handshake
  (unexpected EOF, TLS 1.2 and 1.3, re-checked 2026-09-27), so it is probed on port 80 (GET / returns a
  181-byte S3 403) with TCP and ICMP only. No Locaweb speed-test or looking-glass host resolves.
targets:
  - name: Locaweb-SaoPaulo
    host: s3.locaweb.com.br
    kinds: [tcp, icmp]
    port: 80
    region: sp
    city: Sao Paulo
    country: BR
    geo: sa
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 0
      bytes: 0
