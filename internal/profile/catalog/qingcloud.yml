provider: qingcloud
display: QingCloud
kind: cloud
category: [vps, storage]
sources:
  - https://docsv4.qingcloud.com/user_guide/storage/object_storage/intro/product/
  - https://docsv4.qingcloud.com/user_guide/storage/object_storage/
  - https://docsv4.qingcloud.com/user_guide/network/vpc/billing/price/
notes: >-
  QingCloud QingStor object-storage zones pek3a and pek3b (Beijing 3), sh1a (Shanghai 1) and gd2
  (Guangdong 2) are probed via the documented endpoints <zone>.qsstor.com (GET / is a 231-byte 403); the
  older <zone>.qingstor.com names still work. Every address geolocates to its city and every client
  subnet gets the same answer. The compute-only zones jn1 (Jinan) and ap2a (Hong Kong) have no
  object-storage endpoint: <zone>.qsstor.com for them hits a Beijing wildcard catch-all (139.198.8.201).
  ap3 (Jakarta) is no longer in the zone lists and did not answer.
targets:
  - name: QingCloud-pek3a
    host: pek3a.qsstor.com
    kinds: [tcp]
    region: pek3a
    city: Beijing
    country: CN
    geo: as
    anycast: false
    notes: "AS59078 Yunify, Beijing"
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 231
