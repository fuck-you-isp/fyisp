provider: kamatera
display: Kamatera
kind: cloud
category: [vps]
sources:
  - https://www.kamatera.com/data-centers/
notes: >-
  Official per-data-centre latency hosts <dc>-speedtest.kamatera.com, taken from the data-latency-url
  attributes of the Kamatera data-centers page (20 locations; Miami is listed without one). GET / is a
  2.7 KB speed-test page; never fetch its test files. Geo-IP of every IP matches the city. The four
  extra Israeli sites (il, il-rh, il-pt, il-ha) are not on the public page but have the same kind of
  host on Kamatera's Israeli network (AS44709/AS25052); geo-IP matches. Stockholm answers at ~26 ms
  from Helsinki (routed via Frankfurt), geo-IP says Stockholm. Miami (us-mi) resolves but answered
  nothing today.
targets:
  - name: Kamatera-eu
    host: eu-speedtest.kamatera.com
    kinds: [https, tcp]
    region: eu
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    notes: >-
      No ICMP reply today.
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 200
      bytes: 2654
