provider: riot
display: Riot Games (League of Legends, VALORANT)
kind: game
category: [moba, fps]
sources:
  - https://aws.amazon.com/solutions/case-studies/riot-games-local-zones-case-study/   # official: game servers in AWS Regions + Local Zones (+ Outposts)
  - https://aws.amazon.com/solutions/case-studies/riot-games-case-study/
  - https://d1.awsstatic.com/events/Summits/reinvent2023/GAM304_Exiting-the-data-center-A-League-of-Legends-and-VALORANT-story.pdf
  - https://nelsonslog.wordpress.com/2017/01/12/league-of-legends-server-ips/          # community: historical LoL ping IPs
  - https://gameserverping.com/lol                                                    # community ping list (same IPs)
notes: >-
  Riot publishes no ping/latency-test hosts. The LoL IPs below are the
  long-circulated community "ping test" addresses (Riot Direct, AS6507); none
  answered ICMP or TCP/443 on 2026-09-27, so they are kept with kinds: [] as
  known-but-unreachable and are skipped by every profile. Regional
  *.api.riotgames.com hosts are Cloudflare anycast fronts (not regional) and
  need an API key, so they are not used. Cloud mapping (official AWS case
  study: Riot "prefers AWS Regions, uses Local Zones where no Region is near,
  Outposts elsewhere"; 17 Local Zones in use): community ping sites measure
  LoL/VALORANT regions against AWS regions — NA = us-east-1 / us-west-2
  (LoL NA shard historically Chicago), EUW = eu-west-1 / eu-central-1,
  EUNE = eu-central-1, TR/ME = me-south-1 / me-central-1, BR = sa-east-1,
  LAN = Miami area, LAS = Santiago, JP = ap-northeast-1, KR = ap-northeast-2,
  OCE = ap-southeast-2, SEA = ap-southeast-1, VALORANT Mumbai = ap-south-1.
  A "riot" gamers profile should therefore select the matching AWS catalog
  targets (AWS-<region>) instead of Riot-owned endpoints.
targets:
