provider: hivelocity
display: Hivelocity
kind: cloud
category: [bare-metal, vps]
sources:
  - https://www.hivelocity.net/data-centers/
  - https://www.hivelocity.net/about/network/
  - https://www.hivelocity.net/kb/how-to-use-hivelocitys-speedtest-servers-with-speedtest-cli/
notes: >-
  Official Hivelocity speed-test hosts speedtest.<site>.hivelocity.net, one per site offered in the
  download-test selector on the network page (codes from that selector; atl, dal, lax, nyc, tpa are
  ATL2, DAL1, LAX2, NYC1, TPA1 on the data-center page). GET / is a ~350 byte file index; never fetch
  the 10MiB/100MiB/10GiB files. Sites on the data-center page without a published speed-test host
  (IAD1, JFK1, OGB1, PHL1, SJC1, the EDGE-* sites, POZ1, RIX1, VNO1 and all of Asia-Pacific except
  BOM1) are kept with kinds: [] (the speedtest.<site> name does not resolve). ORD2, NYC1, YYZ2, SAO1,
  FRA2 and LON1 have published hosts that did not answer anything on 2026-09-27 and are also kinds: [].
  Some hosts serve a certificate for another name (TCP 443 + ICMP only); some drop ICMP.
targets:
  - name: Hivelocity-alb1
    host: speedtest.alb1.hivelocity.net
    kinds: [https, tcp, icmp]
    region: ALB1
    city: Albany
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 265
