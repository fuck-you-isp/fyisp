provider: rackcorp
display: RackCorp
kind: cloud
category: [vps, storage]
sources:
  - https://www.rackcorp.com/storage/s3storage
  - https://github.com/rclone/rclone/blob/master/backend/s3/provider/RackCorp.yaml
notes: >-
  Australian cloud and colocation provider (AS56038) with object storage in 18 locations, each
  with an S3 endpoint <region>.s3.rackcorp.com; an anonymous GET / is a 213-byte 400. Manila,
  Bangkok, Jakarta, Ulaanbaatar, Bishkek and Hong Kong resolve to in-country RackCorp addresses
  (geo-IP and RTT agree). Melbourne, Brisbane, Perth, Auckland, Tokyo, Singapore, Frankfurt and
  both US endpoints resolve to the Sydney pool, so they are kept with kinds: []. The anycast
  s3.rackcorp.com, au.s3.rackcorp.com and us.s3.rackcorp.com (NXDOMAIN) are not listed.
targets:
  - name: RackCorp-au-nsw
    host: au-nsw.s3.rackcorp.com
    kinds: [tcp]
    region: au-nsw
    city: Sydney
    country: AU
    geo: oc
    anycast: false
    notes: >-
      Round-robin over four Sydney addresses (rDNS au-nsw-eqx4, Equinix SY4).
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 400
      bytes: 213
  - name: RackCorp-au-vic
    host: au-vic.s3.rackcorp.com
    kinds: []
    region: au-vic
    city: Melbourne
    country: AU
    geo: oc
    anycast: false
    tags: [unreachable]
    notes: >-
      Resolves to a RackCorp address in Sydney (116.206.80.17 or 103.76.41.78, the au-nsw
      pool) on 2026-09-27, so it does not measure this location.
    verified:
      date: 2026-09-27
      icmp: false
      tcp: false
