provider: crusoe
display: Crusoe Cloud
kind: cloud
category: [gpu]
sources:
  - https://docs.crusoecloud.com/reference/locations/index.html
notes: >-
  Crusoe regions: us-east1-a (Virginia), us-southcentral1-a (Houston TX), us-west1-a (Sparks NV),
  eu-iceland1-a (Iceland), eu-norway1-a (Norway, launching). No per-region public hostname exists
  (object-storage/api.<region> guesses do not resolve), so only the Cloudflare anycast API
  api.crusoecloud.com (GET / is a 2-byte 200).
targets:
  - name: Crusoe-api
    host: api.crusoecloud.com
    kinds: [https, tcp, icmp]
    path: /
    anycast: true
    notes: Cloudflare anycast
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 2
