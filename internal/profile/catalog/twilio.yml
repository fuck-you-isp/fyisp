provider: twilio
display: Twilio STUN regions
kind: service
category: [voice]
sources:
  - https://www.twilio.com/docs/stun-turn
  - https://www.twilio.com/docs/stun-turn/api
  - https://www.twilio.com/docs/stun-turn/regions
  - https://www.twilio.com/en-us/stun-turn/pricing
notes: >-
  Twilio Network Traversal Service STUN, one fixed region each (hosted on AWS EC2; the
  documented edge names such as frankfurt.stun.twilio.com resolve to the same pools).
  STUN is documented as free in every region. Probed with STUN Binding Requests only (no
  TURN, no credentials), a burst of 5 every 30 s: a world map of the UDP path for calls
  that land in another region. Every region answered 2/2 Binding Requests from a
  Frankfurt-area vantage point on 2026-10-10.
targets:
  - {name: Twilio-us1, host: us1.stun.twilio.com, kinds: [udp], port: 3478, interval: 30s, region: us1, city: Ashburn, country: US, geo: na, tags: [udp-path], verified: {date: 2026-10-10, stun: 2/2, rtt_ms: 104.1}}
  - {name: Twilio-us2, host: us2.stun.twilio.com, kinds: [udp], port: 3478, interval: 30s, region: us2, city: Umatilla, country: US, geo: na, tags: [udp-path], verified: {date: 2026-10-10, stun: 2/2, rtt_ms: 173.1}}
