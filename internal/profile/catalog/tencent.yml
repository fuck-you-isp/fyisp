notes: >-
  Tencent publishes no ping host, so each region uses the public COS service
  endpoint cos.<region>.myqcloud.com. An unauthenticated GET / returns 403 (about
  480 bytes of XML), so no credentials are sent. The file covers all 17 public-cloud
  regions in the COS regions list (2026-09-27): 6 mainland China (tagged
  mainland-china) and 11 international. Left out: ap-beijing-1 (a legacy single-zone
  Beijing endpoint that duplicates ap-beijing) and the finance cloud regions
  ap-shenzhen-fsi, ap-shanghai-fsi and ap-beijing-fsi, which need a special account.
  ap-mumbai, na-toronto and eu-moscow have been retired and resolve to 0.0.0.1, so
  they are left out too. Mainland regions answered from Helsinki at 179-259 ms.
  ap-chengdu and ap-chongqing both resolved into 183.66.100.0/24 (China Telecom
  Chongqing), so the Chengdu endpoint may be served from Chongqing. ap-hongkong is
  347 ms from Helsinki, above Singapore (183 ms), because of how Tencent routes it;
  its IP (43.132.x) is Tencent's HK range. Other RTTs matched geography: Frankfurt
  24 ms, Virginia 102 ms, Riyadh 110 ms, Silicon Valley 174 ms, Southeast Asia
  183-208 ms, Sao Paulo 215 ms, Tokyo/Seoul 283-293 ms. One GET per 15 s is
  negligible.
  Also covered: ap-osaka (Osaka), launched in April 2025 and not yet in the COS
  region table; cos.ap-osaka answers the same 403 at 285 ms, next to Tokyo's
  273 ms. Two other hosts answer but are not public regions and are left out:
  ap-taipei (175.97.x, 224 ms) and ap-qingyuan (Guangdong, 106.55.x, 197 ms).
  ap-guangzhou's DNS alternates between two IPs; one TCP connect timed out on
  2026-09-27 and a retry worked, so expect some loss on that path.
  2026-09-27 audit (second pass), GeoDNS: every host was resolved through
  8.8.8.8 with EDNS client subnets from Helsinki, China Telecom, China
  Unicom, China Mobile, US, HK, SG and BR. Mainland COS hosts hand Chinese
  carriers a per-carrier access IP that is often in another province
  (cos.ap-guangzhou -> Fujian/Hunan/Jiangsu, cos.ap-beijing -> Hebei/Shandong),
  and foreign clients get cos.ap-shanghai in China Telecom Anhui (Hefei, by
  traceroute) and cos.ap-chengdu in Chongqing. cos.ap-hongkong and
  cos.ap-singapore send Chinese clients to a Tokyo address (43.128.240.x).
  Those six targets were switched, keeping their names, to the documented
  Cloud Log Service (CLS) public API domain <region>.cls.tencentcs.com, whose
  GET / is an unauthenticated "200 OK" (6 bytes). CLS also answers per
  carrier, but every answer seen was in the right province or city (Beijing
  confirmed by traceroute via China Telecom's Beijing IDC, Chengdu via China
  Unicom Sichuan, Hong Kong via PCCW HK). The Shanghai, Guangzhou and Chengdu
  CLS IPs are China Unicom and showed 30-60 ms RTT jitter from Helsinki; that
  is the path, not the host. COS stays for ap-nanjing and ap-chongqing (all
  answers in-province) and for the international regions (one answer set for
  every client). Added from the CVM regions page: na-queretaro (Mexico, COS,
  162 ms) and ap-johorbahru (Johor Bahru; CLS host, not yet on the CLS region
  page, in Tencent's Malaysian range, 183 ms via Singapore). ap-zhongwei
  (Zhongwei, Ningxia) is on the CVM page, but its COS host is fronted from
  China Telecom Hebei (Shijiazhuang, by traceroute) and it has no CLS host,
  so it is kept with kinds: []. Not added: ap-shanghai-adc / ap-zhongwei-adc
  (self-driving clouds, restricted) and ap-taipei / ap-qingyuan (they answer
  but are not on any region page).
