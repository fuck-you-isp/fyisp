provider: buyvm
display: BuyVM (Frantech)
kind: cloud
category: [vps]
sources:
  - https://buyvm.net/datacenters/
  - https://wiki.buyvm.net/doku.php/network
  - https://speedtest.lv.buyvm.net/
notes: >-
  Official Frantech looking-glass / speed-test hosts speedtest.<loc>.buyvm.net, one per location
  (Las Vegas, New York/Piscataway NJ, Miami, Luxembourg). GET / is the small LG page; never fetch
  the test files. Miami is not on the buyvm.net datacenters page but has a live official LG
  (announced 2021; rDNS of its IP points at virtushost.net).
targets:
  - name: BuyVM-Las-Vegas
    host: speedtest.lv.buyvm.net
    kinds: [https, tcp, icmp]
    region: lv
    city: Las Vegas
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 10549
