provider: flyio
display: Fly.io
kind: cloud
sources:
  - https://docs.fly.io/reference/regions/
  - https://debug.fly.dev/
  - https://api.machines.dev/v1/platform/regions
notes: >-
  Fly.io fronts every app with one global anycast network and publishes no per-region test hosts
  (*.fly.dev is a wildcard for app names, e.g. iad.fly.dev is not a region endpoint). debug.fly.dev is
  Fly's own debug app: it echoes request headers incl. Fly-Region (the edge that answered) in ~550 B.
  It measures latency to the nearest Fly edge only, so country/geo are omitted (anycast: true).
  Per region, the targets Fly-<code> use Fly's WireGuard peer gateways <code>1.gateway.6pn.dev (yyz2 for
  Toronto; yyz1 is NXDOMAIN), which flyctl connects to. They are unicast (rDNS gw-nac-<site>.flyio.net or
  the NetActuate/CacheFly upstream; geo-IP matched each region and RTTs are plausible) and answer ICMP and
  TCP 443, but TLS there uses a private CA, so https is not recorded. They are not published as latency
  test hosts; the load (1 TCP connect + 3 pings per 15 s) is tiny. Region list: 18 regions from the
  public api.machines.dev/v1/platform/regions (bom is marked deprecated but still has a gateway).
targets:
  - name: Fly-anycast
    host: debug.fly.dev
    kinds: [https, tcp, icmp]
    region: global
    anycast: true
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 548
  - name: Fly-ams
    host: ams1.gateway.6pn.dev
    kinds: [tcp, icmp]
    region: ams
    city: Amsterdam
    country: NL
    geo: eu
