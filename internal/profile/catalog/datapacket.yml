notes: >-
  Official per-data-center test IPs ("DC IP Address") from DataPacket's speed-test-files pages, one
  per location (67 listed). They are bare IPs (rDNS <n>.<site>.cdn77.com, DataPacket/CDN77 AS60068),
  and on 2026-09-27 none accepted TCP 443 or 80 (test files are served from other hosts), so every target
  is ICMP only. RTTs from Helsinki were plausible for every site (Helsinki 0.9 ms, Frankfurt 21 ms,
  New York 106 ms, Singapore 181 ms, Sydney 364 ms). Never fetch the 100MB/1GB/10GB test files.
  Calgary, Barcelona, Helsinki and Perth are listed with test files "coming soon" but already have a DC IP.
