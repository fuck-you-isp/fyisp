provider: stackit
display: STACKIT
kind: cloud
category: [iaas]
sources:
  - https://docs.stackit.cloud/platform/regions/
  - https://docs.stackit.cloud/products/storage/object-storage/
notes: >-
  STACKIT (Schwarz Group) has two regions: eu01 (Germany South, Neckarsulm/Ellhofen) and eu02 (Austria
  West, Ostermiething). No public speedtest hosts. The regional Object Storage endpoint
  object.storage.<region>.onstackit.cloud answers ICMP and GET / with a 213 B S3 XML 400 (the regional
  *.api.<region>.stackit.cloud fronts do not answer ICMP).
targets:
  - name: STACKIT-eu01
    host: object.storage.eu01.onstackit.cloud
    kinds: [tcp]
    region: eu01
    city: Neckarsulm
    country: DE
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 400
      bytes: 213
  - name: STACKIT-eu02
    host: object.storage.eu02.onstackit.cloud
    kinds: [tcp]
    region: eu02
    city: Ostermiething
    country: AT
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 400
      bytes: 213
