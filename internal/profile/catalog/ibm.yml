provider: ibm
display: IBM Cloud
kind: hyperscaler
category: [storage]
sources:
  - https://cloud.ibm.com/docs/cloud-object-storage?topic=cloud-object-storage-endpoints
  - https://control.cloud-object-storage.cloud.ibm.com/v2/endpoints
notes: >-
  IBM Cloud publishes no ping host, so each location uses the public Cloud Object
  Storage S3 endpoint s3.<location>.cloud-object-storage.appdomain.cloud. An
  unauthenticated GET / returns 403 AccessDenied (255-byte XML), so no credentials
  are sent. The file covers all 13 regional (multi-zone) endpoints and all 6
  single-data-center endpoints in the COS endpoint list (2026-09-27). Single-site
  ones are tagged single-site. in-che/che01 (Chennai) and ca-mon/mon01 (Montreal)
  are in the same cities but have different IPs and are kept as separate targets.
  Cross-region (us/eu/ap geo) endpoints are left out on purpose because they are not
  tied to one location. Regionality was checked by RTT from Helsinki, FI: EU 31-57
  ms, North America 111-172 ms, India 158-191 ms, Singapore 204 ms, Brazil 215 ms,
  Japan 267-276 ms, Sydney 330 ms. One GET per 15 s is negligible.
  2026-09-27 audit: the public COS endpoint JSON
  (control.cloud-object-storage.cloud.ibm.com/v2/endpoints) lists exactly
  these 19 regional and single-site endpoints. eu-fr2 (Paris, the restricted
  financial-services region) has no COS endpoint, and its VPC API host is
  behind Cloudflare anycast, so it is left out. The old per-datacenter
  speedtest.<dc>.softlayer.com hosts still resolve but did not answer
  ICMP/HTTP/HTTPS.
targets:
  - name: IBM-us-south
    host: s3.us-south.cloud-object-storage.appdomain.cloud
    kinds: [https, tcp, icmp]
    region: us-south
    city: Dallas
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 255
