provider: ionos
display: IONOS Cloud
kind: cloud
category: [iaas, vps]
sources:
  - https://cloud.ionos.com/data-centers
  - https://docs.ionos.com/cloud/storage-and-backup/ionos-object-storage/endpoints
  - https://docs.ionos.com/cloud/llms-full.txt
  - https://api.ionos.com/docs/logging/v1/
notes: >-
  IONOS Cloud (ex-ProfitBricks) has 11 compute locations (de/fra, de/fra/2, de/txl, de/fkb, gb/lhr,
  gb/bhx, fr/par, es/vit, us/las, us/ewr, us/mci). No public speedtest or looking-glass hosts exist.
  Where the location hosts a public IONOS Object Storage region (eu-central-1 Frankfurt, eu-central-2
  Berlin, eu-south-2 Logrono, us-central-1 Lenexa) the S3 endpoint is used: it answers ICMP and GET /
  returns a tiny S3 XML error. Other locations use the regional managed-service API
  logging.<loc>.ionos.com (GET / = 146 B JSON 404, TCP/HTTPS only, no ICMP). de/fra/2 and de/fkb
  expose no location-specific public endpoint, so they are kept with kinds: []. IONOS VPS / hosting
  (ionos.de/.co.uk/.es/.com, formerly 1&1) and the group brands Strato, Arsys and Fasthosts run in the
  same IONOS data centres (Karlsruhe/Baden-Baden, Berlin, Worcester/Gloucester, Logrono, Lenexa) and
  publish no per-location test hosts; their websites are central fronts, so they are covered by this
  file rather than duplicated.
targets:
  - name: IONOS-de-fra
    host: s3.eu-central-1.ionoscloud.com
    kinds: [https, tcp, icmp]
    region: de/fra
    city: Frankfurt
    country: DE
    geo: eu
    anycast: false
    notes: >-
      S3 region eu-central-1; ionoscloud S3 endpoint; GET / is a 218 B S3 AccessDenied XML
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 218
  - name: IONOS-de-fra-2
    host: logging.de-fra-2.ionos.com
    kinds: []
    region: de/fra/2
    city: Frankfurt
    country: DE
    geo: eu
    anycast: false
    tags: [unreachable]
    notes: >-
      Frankfurt 2 has no location-specific public endpoint (no S3 region, no <svc>.de-fra-2.ionos.com names); host is the name the regional-API pattern would use and is NXDOMAIN today.
    verified:
      date: 2026-09-27
      icmp: false
      tcp: false
      https: 0
      bytes: 0
