provider: tiernet
display: Tier.Net
kind: cloud
category: [vps, bare-metal, colocation]
sources:
  - https://www.tier.net/colocation
notes: >-
  Tier.Net (AS397423) lists six US data centres: Ashburn VA, Bend OR, Binghamton NY, Charlotte NC,
  Dallas TX and Manhattan NY, and publishes looking-glass hosts lg.<site>.tier.net for five of them.
  Dallas has no published name but lg.tx.tier.net exists with the same setup (rDNS matches, geo-IP
  Dallas). All targets are unicast in AS397423; geo-IP and RTT from Helsinki fit each city. GET
  /robots.txt answers a 196 B 404.
targets:
  - name: TierNet-Ashburn
    host: lg.va.tier.net
    kinds: [https, tcp, icmp]
    path: /robots.txt
    region: va
    city: Ashburn
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 196
  - name: TierNet-Bend
