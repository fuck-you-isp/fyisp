provider: nebius
display: Nebius AI Cloud
kind: cloud
category: [gpu]
sources:
  - https://docs.nebius.com/overview/regions
  - https://docs.nebius.com/object-storage/interfaces/aws-cli
notes: >-
  Regional Object Storage (S3) endpoints storage.<region>.nebius.cloud, one per region of the Nebius
  regions page (10 incl. the private eu-north2 Iceland region). GET / without credentials returns a
  224-byte S3 AccessDenied (403). Every IP is in a Nebius AS geolocated to the region's country and
  RTTs from Helsinki match (eu-north1 Mantsala ~2 ms, us-central1 Kansas City ~120 ms).
targets:
  - name: Nebius-eu-north1
    host: storage.eu-north1.nebius.cloud
    kinds: [https, tcp, icmp]
    region: eu-north1
    city: Mantsala
    country: FI
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 224
  - name: Nebius-eu-north2
    host: storage.eu-north2.nebius.cloud
    kinds: [https, tcp, icmp]
    region: eu-north2
    city: Keflavik
    country: IS
    geo: eu
    anycast: false
    notes: private region (dedicated customers); storage endpoint is public
    verified:
      date: 2026-09-27
      icmp: true
