provider: wasabi
display: Wasabi
kind: cloud
category: [storage]
sources:
  - https://docs.wasabi.com/docs/what-are-the-service-urls-for-wasabi-s-different-storage-regions
notes: >-
  All 16 Wasabi storage regions from the official service-URL list, probed via
  s3.<region>.wasabisys.com. Anonymous GET / returns a 303 redirect to wasabi.com with a 49 B body.
  Wasabi publishes only state/metro names for some US regions (N. Virginia, Texas, Oregon); the cities
  used are the known facility metros. eu-west-1 and eu-west-3 are two separate London regions (uk-1,
  uk-2). Re-checked 2026-09-27: region list unchanged (16; guessed names like us-east-3, ap-south-1,
  sa-east-1 are NXDOMAIN). The 303 at / is kept on purpose: fyisp does not follow redirects, and every
  other path returns a larger (~0.4 KB) NoSuchBucket error that also costs Wasabi a bucket lookup.
  us-west-2 (San Jose) and ca-central-1 (Toronto) showed 15-50 ms RTT spread from Helsinki; all others
  were steady.
targets:
  - name: Wasabi-us-east-1
    host: s3.us-east-1.wasabisys.com
    kinds: [https, tcp, icmp]
    region: us-east-1
    city: Ashburn
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 303
      bytes: 49
