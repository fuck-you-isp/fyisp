provider: epic
display: Epic Games / Fortnite
kind: gaming-platform
category: [matchmaking, store]
sources:
  - https://www.epicgames.com/help/c-202300000001636/c-202300000001719/fortnite-latency-and-ping-troubleshooting-a202300000010042
  - https://ip-ranges.amazonaws.com/ip-ranges.json
notes: >-
  ping-<subregion>.ds.on.epicgames.com are the hosts Epic's Fortnite support article
  tells players to ping; each resolves round-robin to 4 AWS EC2 instances in the
  subregion's datacenter (mapped via AWS ip-ranges.json). ICMP only (no TCP/HTTPS
  listener). NA-East spans us-east-1 + us-east-2, NA-West spans us-west-1 + us-west-2,
  NA-Central is the AWS Dallas Local Zone (us-east-1-dfw-2). ping-eu is a round-robin
  over de/gb/fr and is omitted in favour of the per-country hosts. ping-me (Bahrain,
  me-south-1) resolves but did not answer ICMP from the verifier, so it is omitted.
  Epic-launcher-api is the Cloudflare-fronted launcher service (404, 0 B body).
targets:
  - name: Fortnite-nae
    host: ping-nae.ds.on.epicgames.com
    kinds: [icmp]
    region: us-east-1/us-east-2
    country: US
    geo: na
    anycast: false
    tags: [matchmaking]
    verified:
      date: 2026-09-27
      icmp: true
      tcp: false
