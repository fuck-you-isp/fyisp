provider: railway
display: Railway
kind: cloud
category: [paas]
sources:
  - https://docs.railway.com/reference/deployment-regions
notes: >-
  Railway regions: us-west2 (California), us-east4-eqdc4a (Virginia), europe-west4-drams3a
  (Amsterdam), asia-southeast1-eqsg3a (Singapore). All public traffic (*.up.railway.app,
  *.proxy.rlwy.net) enters Railway's own anycast edge (AS400940, ~29 ms from Helsinki despite US
  geo-IP), so there is no located per-region endpoint. One anycast target on railway.com (same edge;
  GET /robots.txt ~0.5 KB).
targets:
  - name: Railway-edge
    host: railway.com
    kinds: [https, tcp, icmp]
    path: /robots.txt
    anycast: true
    notes: Railway anycast edge (AS400940)
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 520
