provider: colocrossing
display: ColoCrossing
kind: cloud
category: [bare-metal, colocation]
sources:
  - https://www.colocrossing.com/datacenters/
  - https://www.colocrossing.com/datacenter/buffalo-ny/
notes: >-
  ColoCrossing (now part of HostPapa, AS36352) lists ten data centres: Atlanta, Buffalo, Chicago,
  Dallas, Dublin, Los Angeles, New York, San Jose, Seattle and Toronto. Each data-centre page names a
  looking-glass host lg.<city>.colocrossing.com; those are the targets (unicast, rDNS
  *-host.colocrossing.com, geo-IP and RTT from Helsinki match each city). GET /robots.txt answers a
  146 B 404 (/ is a 5 KB page with speed-test file links). The New York looking glass
  (lg.nyc.colocrossing.com) did not answer ping, TCP or HTTP on 2026-09-27 and its IP geolocates to
  Buffalo, so New York is kept with kinds: [].
targets:
  - name: ColoCrossing-Atlanta
    host: lg.atl.colocrossing.com
    kinds: [tcp]
    path: /robots.txt
    region: atl
    city: Atlanta
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 146
