provider: rackspace
display: Rackspace Cloud
kind: cloud
category: [vps, storage]
sources:
  - https://docs.rackspace.com/docs/about-regions
  - https://docs.rackspace.com/docs/rest-api-guide-for-openstack-flex
notes: >-
  Rackspace Cloud Files (Swift) storage endpoints, one per region, answer GET / with a 70-byte 404.
  They are used instead of <region>.speedtest.rackspace.com: the dfw/ord speed-test hosts no longer
  answer and the others have an invalid TLS certificate. Legacy public-cloud regions DFW, ORD, IAD,
  LON, HKG, SYD (6 of 6) use storage101.<dc>.clouddrive.com. OpenStack Flex regions DFW3, SJC3, IAD3
  (3 of 3) use swift.api.<region>.rackspacecloud.com. The Flex DFW3/IAD3 hosts did not answer ping.
  The regional compute API hostnames sit behind Cloudflare (anycast) and are not used.
targets:
  - name: Rackspace-DFW
    host: storage101.dfw1.clouddrive.com
    kinds: [https, tcp, icmp]
    region: DFW
    city: Dallas
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 70
  - name: Rackspace-ORD
