provider: ctyun
display: China Telecom Cloud (CTYun)
kind: cloud
category: [iaas, storage]
sources:
  - https://www.ctyun.cn/products/oos
  - https://www.ctyun.cn/document/10026693
notes: >-
  China Telecom's public cloud. Its Object-Oriented Storage (OOS) has one S3-compatible endpoint
  per resource pool, oos-<province><city>.ctyunapi.cn, and an anonymous GET / is a 204-byte 403.
  Every host listed resolves to its own China Telecom address, and geo-IP matched the province in
  the code in every case. No complete official list of OOS pools was reachable, so the hosts were
  found by resolving province and city codes; treat the list as incomplete. oos-xzls (Lhasa) and
  oos-gz (Guangzhou) resolve but refused TCP 443 on 2026-09-27, and oos-cq resolves to a
  198.18.0.0/15 benchmark address, so they are left out. The newer ZOS product has no public per-
  region hostname that answered.
targets:
  - name: CTYun-ahwh
    host: oos-ahwh.ctyunapi.cn
    kinds: [tcp]
    region: ahwh
    city: Wuhu
    country: CN
    geo: as
    anycast: false
    notes: >-
      oos-cn.ctyunapi.cn (the national default) is a CNAME to this host. Geo-IP says Hefei,
      Anhui.
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 204
