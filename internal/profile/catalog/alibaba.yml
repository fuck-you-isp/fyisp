provider: alibaba
display: Alibaba Cloud
kind: hyperscaler
category: [storage]
sources:
  - https://www.alibabacloud.com/help/en/oss/user-guide/regions-and-endpoints
notes: >-
  Alibaba publishes no ping host, so each region uses the public OSS endpoint
  oss-<region>.aliyuncs.com. An unauthenticated GET / returns 403 AccessDenied
  (about 360-370 bytes of XML), so no credentials are sent. The file covers all 31
  regions in the OSS regions-and-endpoints table (2026-09-27) plus two local regions
  that are not in that table but resolve and answer like the rest: cn-fuzhou and
  cn-wuhan-lr (tagged local-region). Mainland-China regions (tagged mainland-china)
  all answered from Helsinki: 171-257 ms RTT with no loss in 3 pings. TLS setup to
  cn-guangzhou and cn-fuzhou once took about 1.2 s, so expect jitter and occasional
  filtering on that path. Regionality was checked by RTT from Helsinki, FI:
  Frankfurt 21 ms, London 37 ms, Paris 44 ms, Riyadh 109 ms, Dubai 148 ms, Virginia
  117 ms, Mexico 163 ms, Silicon Valley 174 ms, Southeast Asia 178-222 ms, Sao Paulo
  212 ms, Hong Kong/Tokyo/Seoul 264-284 ms. Hong Kong, Tokyo and Seoul are slower
  than mainland China from here because of routing, but each has its own IP. Gaps:
  ap-south-1 (Mumbai) and ap-southeast-2 (Sydney) were closed and are NXDOMAIN. The
  finance-cloud endpoints resolve to private 100.64/10 addresses and are left out.
  oss-eu-west-3 resolves and answers at 28 ms but is not in the docs yet, likely the
  Netherlands region announced for October 2026. Add it once it is listed. One GET
  per 15 s is negligible.
targets:
  - name: Alibaba-cn-hangzhou
    host: oss-cn-hangzhou.aliyuncs.com
    kinds: [https, tcp, icmp]
    region: cn-hangzhou
    city: Hangzhou
    country: CN
    geo: as
    anycast: false
    tags: [mainland-china]
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 361
