provider: gcp
display: Google Cloud Platform
kind: hyperscaler
category: []
sources:
  - https://docs.cloud.google.com/compute/docs/regions-zones
  - https://cloud.google.com/about/locations
  - https://docs.cloud.google.com/storage/docs/regional-endpoints
  - https://docs.cloud.google.com/pubsub/docs/reference/service_apis_overview
  - https://docs.cloud.google.com/docs/security/compliance/endpoints
  - https://cloud.google.com/blog/products/infrastructure/google-cloud-launches-new-region-in-bangkok-thailand
  - https://gcping.com/api/endpoints
  - https://www.gstatic.com/ipranges/cloud.json
notes: >-
  One target per Google Cloud region (43 regions as of 2026-09; list cross-checked
  against the regions-zones docs table and gcping.com/api/endpoints). Each region uses
  its Cloud Storage *regional endpoint* storage.<region>.rep.googleapis.com, which
  resolves to a distinct per-region address (34.1.x.x) and terminates TCP/ICMP in the
  region itself - RTTs measured from Helsinki scale with distance (europe-north1/Hamina
  ~9 ms, europe-west3 ~31 ms, us-east4 ~111 ms, australia-southeast2 ~387 ms), unlike
  global *.googleapis.com hosts which answer from the nearest GFE (~3 ms). An
  unauthenticated GET / returns a tiny XML 400 (MissingSecurityHeader, 181 B); no
  data is read and no auth is attempted. asia-southeast3 (Bangkok, launched 2026-01)
  has no storage regional endpoint yet, so it uses the Pub/Sub regional endpoint
  pubsub.asia-southeast3.rep.googleapis.com (per-region 34.191.x.x, ~290 ms vs ~252 ms
  for Singapore; GET / -> 404, ~1.5 KB); switch to storage.asia-southeast3.rep.googleapis.com
  once it resolves. gcping.com's per-region Cloud Run URLs (*.a.run.app) were rejected:
  they are a community project (not Google-operated; no stated ToS for third-party
  polling) and every region resolves to the same anycast GFE addresses, so ICMP/TCP
  only measure the nearest Google edge. GCP-global is Google's anycast front for the
  same Storage API (storage.googleapis.com) for an apples-to-apples edge baseline.
  2026-09-27 audit: the regions-zones table still lists the same 43 regions, and
  storage.asia-southeast3.rep.googleapis.com still does not resolve. Regional
  API hosts also exist for europe-west15, us-east7, us-central2 and us-west8
  (all four are scopes in gstatic.com/ipranges/cloud.json), but none of them
  is in the public region list (restricted or pre-launch), so they are
  left out. Regionality re-checked: each storage.<region>.rep host
  returns one static IP for every EDNS client subnet (no GeoDNS), and
  Globalping probes confirm the address answers only in its region
  (asia-northeast1: 3 ms from Tokyo, 227 ms from Frankfurt; us-west1: 7 ms
  from Seattle; europe-north1: 40 ms from Frankfurt, 267 ms from Tokyo),
  so these are not globally fronted. The suggested alternatives are worse:
  <region>-docker.pkg.dev and <region>-run.googleapis.com resolve to the
  shared global GFE pools (172.253/172.217), not per-region addresses.
  For asia-southeast3, pubsub, compute and secretmanager .rep hosts all
  give the same 1.5 KB 404 (logging.rep gives a 19 B 503 but is a
  failure response, so it was not used). Google sovereign offerings (S3NS, T-Systems) run under their own
  partner domains and are not covered here.
