provider: hostkey
display: HOSTKEY
kind: cloud
category: [vps, dedicated, gpu]
sources:
  - https://hostkey.com/about-us/data-centers/
  - https://speedtest.hostkey.com/
notes: >-
  HOSTKEY (AS57043/AS395839) lists 13 data centres in 12 cities (two in Frankfurt). Its speed-test page
  publishes one iperf/HTTP test host per location, spd-<cc>srv.hostkey.com (New York is spd-uswb, Istanbul
  spd-tr); Warsaw (spd-plsrv) and Zurich (spd-chsrv) follow the same pattern but are not on the page.
  Every host geolocates to its city in HOSTKEY's AS and RTTs from Helsinki fit. The HTTPS certificates
  don't validate (incomplete chain) and the hosts serve large speed-test pages, so only TCP 443 is used;
  ping is filtered everywhere except Reykjavik. Both Frankfurt DCs (NTT, firstcolo) share one test host,
  so Frankfurt is one target. The Dubai and Tel Aviv services mentioned on the home page are not on the
  data-centre list and have no test host.
targets:
  - name: HOSTKEY-Amsterdam
    host: spd-nlsrv.hostkey.com
    kinds: [tcp]
    region: nl
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      bytes: 0
  - name: HOSTKEY-Frankfurt
