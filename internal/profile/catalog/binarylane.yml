provider: binarylane
display: BinaryLane
kind: cloud
category: [vps]
sources:
  - https://support.binarylane.com.au/support/solutions/articles/1000015169-where-are-binarylane-servers-located-
  - https://syd-lg.binarylane.cloud/
  - https://sin-lg.binarylane.cloud/
notes: >-
  Official BinaryLane looking-glass hosts <loc>-lg.binarylane.cloud, one per location: five NEXTDC sites
  in Australia (S1 Sydney, M2 Melbourne, B2 Brisbane, P1 Perth, A1 Adelaide) and Equinix SG3 in
  Singapore. GET / is a ~9 KB HTML looking-glass page and /favicon.ico is 32 KB, so path /robots.txt is
  used (a 146-byte nginx 404, re-checked on 2026-09-27); never fetch the 10/100/500 MB test files.
targets:
  - name: BinaryLane-syd
    host: syd-lg.binarylane.cloud
    path: /robots.txt
    kinds: [https, tcp, icmp]
    region: syd
    city: Sydney
    country: AU
    geo: oc
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 146
  - name: BinaryLane-mel
    host: mel-lg.binarylane.cloud
    path: /robots.txt
