provider: clouvider
display: Clouvider
kind: cloud
category: [vps, dedicated]
sources:
  - https://www.clouvider.com/our-datacenters/
  - https://as62240.net/
notes: >-
  Clouvider (AS62240) sells servers in 11 cities. as62240.net publishes one "diagnostic/test IP" per
  location; each location also has a speed-test name <loc>.speedtest.clouvider.net (valid certificate,
  GET / answers 200 with an empty body), which are used here. Most names resolve to the published test IP
  or to the same /24; all geolocate to their city and RTTs from Helsinki fit. Chicago (not in the published
  list) answers ping only (TCP 443 refused). The old lg.clouvider.net looking glass is dead.
targets:
  - name: Clouvider-London
    host: lon.speedtest.clouvider.net
    kinds: [https, tcp, icmp]
    region: lon
    city: London
    country: GB
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 0
