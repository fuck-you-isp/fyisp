provider: phoenixnap
display: phoenixNAP
kind: cloud
category: [bare-metal]
sources:
  - https://phoenixnap.com/network/speed-test
  - https://phoenixnap.com/data-center
  - https://phoenixnap.com/bare-metal-cloud
  - https://github.com/phoenixnap/go-sdk-bmc/blob/develop/billingapi/model_location_enum.go
notes: >-
  Official phoenixNAP speed-test hosts from the network speed-test page (speedtest/speed<site>.phoenixnap.com),
  one per site: Phoenix, Ashburn, Atlanta, Chicago, Amsterdam, Singapore and Belgrade. The hosts serve a
  *.phoenixnap.com certificate (the name matches) without its intermediate chain, so HTTPS cannot verify;
  speedash's certificate also expired on 2026-05-28. TCP 443 + ICMP only. Never fetch the <site>-1gb.test
  files. The Bare Metal Cloud API location list also has Seattle (SEA) and Austin (AUS), which have no
  speed-test host: *.phoenixnap.com is a Cloudflare wildcard, so guessed names resolve to anycast Cloudflare
  and are useless; those two are kept with kinds: []. The other cities on the data-center page are network
  nodes (PoPs), not hosting sites.
targets:
  - name: phoenixNAP-phx
    host: speedtest.phoenixnap.com
    kinds: [tcp]
    region: PHX
    city: Phoenix
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
  - name: phoenixNAP-ash
    host: speedash.phoenixnap.com
    kinds: [tcp]
    notes: TLS certificate expired 2026-05-28 (and no intermediate chain); tcp/icmp only
    region: ASH
    city: Ashburn
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
