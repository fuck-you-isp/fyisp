provider: naver-cloud
display: NAVER Cloud
kind: cloud
category: [vps, storage]
sources:
  - https://api.ncloud-docs.com/docs/en/storage-objectstorage
  - https://guide.ncloud-docs.com/docs/en/objectstorage-start
  - https://www.gov-ncloud.com/
  - https://www.fin-ncloud.com/
notes: >-
  NAVER Cloud Platform regions: Korea (KR), US West (San Jose), Singapore, Japan (Tokyo) and Germany
  (Frankfurt), plus the separate Korean public-sector (gov) and financial (fin) clouds. Each is probed
  via its regional Object Storage S3 endpoint; GET / returns a ~0.2 KB 403. Only the fin and jp
  endpoints answered ICMP. Every IP geolocates to its region (the NAVER ASNs AS23576/AS135354; fin is on
  AS9526 KOSCOM).
targets:
  - name: Naver-kr
    host: kr.object.ncloudstorage.com
    kinds: [https, tcp]
    region: kr-standard
    city: Seoul
    country: KR
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 403
      bytes: 255
  - name: Naver-gov-kr
    host: kr.object.gov-ncloudstorage.com
    kinds: [https, tcp]
    region: gov-kr
    city: Seoul
    country: KR
