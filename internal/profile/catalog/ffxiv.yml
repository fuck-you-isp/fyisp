provider: ffxiv
display: Final Fantasy XIV (Square Enix)
kind: game
category: [mmo]
sources:
  - https://wiki.xiv.zone/Lobby_Server                                                   # community: neolobbyNN.ffxiv.com -> data center mapping
  - https://ffxiv.consolegameswiki.com/wiki/Data_Center                                  # community wiki: logical DCs per physical DC (Shadow closed 2024-08-27)
  - https://support.na.square-enix.com/faqarticle.php?kid=67250&id=5382&page=1&sc=0    # official: data center list (no cities)
  - https://latetothepartyfinder.com/how-to-check-your-ping-on-ffxiv-data-centers/      # community: older per-DC ping IPs (now unresponsive)
  - https://forum.square-enix.com/ffxiv/threads/473595                                  # community: NA DC location (Sacramento)
notes: >-
  One lobby host per logical data center (neolobbyNN.ffxiv.com, the client's
  DC lobby); logical DCs in the same physical DC share a /24, so they measure
  the same site. Square Enix publishes the DC list but no ping hosts; the
  hostname->DC mapping is community-documented (xiv.zone). The lobby hosts
  answer ICMP but have no TCP/443 listener (only ICMP is probed; no game ports).
  The older community per-DC ping IPs (204.2.229.x, 195.82.50.x,
  124.150.157.x) no longer answer ICMP and are not listed. Physical sites:
  JP = Tokyo (Square Enix AS23784), NA = Sacramento area per community
  (geo-IP says San Jose, NTT AS2914), EU = geo-IP Frankfurt (community
  often says London; unconfirmed), OCE Materia = Sydney. neolobby12 (Shadow,
  closed 2024-08-27) no longer answers and is not listed. Cities are
  best-known / geo-IP, not published by Square Enix.
