provider: ovh-storage
display: OVHcloud Object Storage
kind: cloud
category: [storage]
sources:
  - https://help.ovhcloud.com/csm/en-public-cloud-storage-s3-location
  - https://www.ovhcloud.com/en/public-cloud/regions-availability/
notes: >-
  OVHcloud Public Cloud Object Storage S3 endpoints s3.<region>.io.cloud.ovh.net (.ovh.us for the US
  regions), one per region. Anonymous GET / returns a 307 redirect with a ~247 B body. Complements the
  ovh provider (Proof speed-test servers) and fills its gaps: Warsaw, Limburg (de), Toronto and Milan.
  gra, sbg and rbx resolve into the same /24 (141.95.161.0/24, .76/.68/.92) but are not a shared
  front. Re-checked on 2026-09-27: each traceroute's last named hop is that site's own DC router
  (be105.lil2-gra1-sbb2, be101.sbg-g2, be104.lil1-rbx8-sbb2). The RTTs from Helsinki (31.7 / 26.3 / 33.9 ms)
  match the Proof servers of the same DCs (34.6 / 26.3 / 33.9 ms). The .perf. hostnames are the same
  addresses and are not listed separately.
targets:
  - name: OVHObj-gra
    host: s3.gra.io.cloud.ovh.net
    kinds: [tcp]
    region: gra
    city: Gravelines
    country: FR
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 307
      bytes: 247
