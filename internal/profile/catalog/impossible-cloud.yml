provider: impossible-cloud
display: Impossible Cloud
kind: cloud
category: [storage]
sources:
  - https://docs.impossiblecloud.com/impossible-cloud-help/impossible-cloud-storage-guide/storage-console-urls-and-api-endpoints
notes: >-
  Impossible Cloud regional S3 endpoints <region>.storage.impossibleapi.net (CNAME to
  s3-ingress.<region>.impossiblecloud.network). Anonymous GET / returns a 400 InvalidArgument XML body
  (~197 B). The ingress hosts do not answer ICMP. The deprecated eu-east-1 (Poznan) region is omitted:
  its endpoint now sits in the same /24 as eu-north-1 with an identical TCP RTT, so it is no longer
  genuinely in Poznan.
targets:
  - name: ImpossibleCloud-eu-central-2
    host: eu-central-2.storage.impossibleapi.net
    kinds: [https, tcp]
    region: eu-central-2
    city: Frankfurt
    country: DE
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 400
      bytes: 198
  - name: ImpossibleCloud-eu-west-1
    host: eu-west-1.storage.impossibleapi.net
    kinds: [https, tcp]
    region: eu-west-1
    city: Amsterdam
