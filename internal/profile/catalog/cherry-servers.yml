provider: cherry-servers
display: Cherry Servers
kind: cloud
category: [bare-metal, vps]
sources:
  - https://api.cherryservers.com/v1/regions
  - https://speedtest.lt.cherryservers.com/
notes: >-
  Official Cherry Servers speed-test hosts speedtest.<cc>.cherryservers.com, one per region in the
  public regions API (/v1/regions: 7 regions on 2026-09-27). Each host sits in the region's own
  AS/prefix (rDNS *.ptr.cherryservers.net). GET / is a ~2.7 KB page; never fetch the test-10mb /
  100mb / 1000mb files.
targets:
  - name: Cherry-Siauliai
    host: speedtest.lt.cherryservers.com
    path: /robots.txt
    kinds: [https, tcp, icmp]
    region: LT-Siauliai
    city: Siauliai
    country: LT
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 293
  - name: Cherry-Amsterdam
    host: speedtest.nl.cherryservers.com
