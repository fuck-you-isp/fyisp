provider: synology-c2
display: Synology C2 Object Storage
kind: cloud
category: [storage]
sources:
  - https://kb.synology.com/en-us/C2/tutorial/C2_Object_Storage_API
  - https://c2.synology.com/en-global/object-storage/overview
notes: >-
  Every Synology C2 Object Storage region endpoint <region>.s3.synologyc2.net (eu-001..005,
  us-001..004, tw-001; eu-005 and us-004 were found by DNS on 2026-09-27, the KB only shows eu-001 and
  us-001 as examples, and eu/us-006..010, tw-002..004 and other country prefixes are NXDOMAIN). Anonymous GET / returns a 404 body (70 B). The regions are storage clusters in
  three data centers: EU (Frankfurt), US (Seattle) and Taiwan; RTTs matched (all EU ~21 ms from
  Helsinki, US 157-170 ms, like other Seattle hosts; eu-005 is AS44066 firstcolo Frankfurt, us-004
  geolocates to Seattle). tw-001 (HiNet addresses) does not answer ICMP.
targets:
  - name: SynologyC2-eu-001
    host: eu-001.s3.synologyc2.net
    kinds: [tcp]
    region: eu-001
    city: Frankfurt
    country: DE
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 70
