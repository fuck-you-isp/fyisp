provider: cdn-cloudflare
display: "Cloudflare CDN"
kind: cdn
category: []
sources:
  - https://developers.cloudflare.com/fundamentals/reference/cdn-cgi-endpoint/
  - https://speed.cloudflare.com/
  - https://www.cloudflare.com/learning/cdn/glossary/anycast-network/
notes: >-
  All targets are anycast: true in fyisp's sense (no fixed location): the
  measured edge is whichever PoP the network maps you to, so the number is
  'latency to your nearest edge of this CDN' and changes if routing/mapping
  moves you to another PoP. Cloudflare is pure IP anycast: every PoP announces
  the same prefixes, so 'nearest edge' is the BGP-closest Cloudflare data
  center (not necessarily the geographically closest). /cdn-cgi/trace is a
  ~200-byte plain-text endpoint served by the edge itself on every Cloudflare
  zone; its colo= line names the PoP (IATA code) that answered.
  speed.cloudflare.com /__down?bytes=0 is the speed-test download endpoint
  with a zero-byte body (a Worker; Server-Timing shows edge time). The 1.1.1.1
  resolver is in the dns-cloudflare catalog.
targets:
  - name: CDN-Cloudflare
    host: www.cloudflare.com
    kinds: [https, tcp, icmp]
    path: "/cdn-cgi/trace"
    anycast: true
    tags: [edge-trace]
    notes: >-
      colo= in the body names the answering PoP.
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 207
  - name: CDN-Cloudflare-speedtest
    host: speed.cloudflare.com
    kinds: [https, tcp, icmp]
    path: "/__down?bytes=0"
    anycast: true
    tags: [speedtest]
    notes: >-
      Published speed-test endpoint; bytes=0 returns an empty 200.
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 0
