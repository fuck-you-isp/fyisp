    host: dynamodb.us-east-1.amazonaws.com
    kinds: [https, tcp, icmp]
    path: /ping
    region: us-east-1
    city: Ashburn
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 42
