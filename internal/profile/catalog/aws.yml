provider: aws
display: Amazon Web Services
kind: hyperscaler
category: []
sources:
  - https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html   # region list (34 commercial regions, opt-in status)
  - https://docs.aws.amazon.com/general/latest/gr/ddb.html                               # DynamoDB regional endpoints
  - https://raw.githubusercontent.com/boto/botocore/develop/botocore/data/endpoints.json # partitions/regions incl. GovCloud, China, EU Sovereign Cloud
  - https://ip-ranges.amazonaws.com/ip-ranges.json                                       # used to confirm each endpoint IP is announced for its own region
  - https://github.com/mda590/cloudping.co                                               # prior art: AWS latency measured against dynamodb.<region>/ping
  - https://www.aljazeera.com/news/2026/3/24/amazon-says-aws-bahrain-region-disrupted-following-drone-activity
  - https://www.theregister.com/off-prem/2026/07/21/iran-says-its-struck-offline-aws-facility-in-bahrain-again/5275762
  - https://www.datacenterdynamics.com/en/news/aws-launches-uae-cloud-region/
  - https://www.aboutamazon.com/news/aws/aws-cloud-region-saudi-arabia
notes: >-
  One target per AWS commercial region (all 34 in AWS's region table as of
  2026-09-27, including every opt-in region; re-checked against botocore
  endpoints.json and ip-ranges.json). Endpoint is the public DynamoDB
  regional endpoint, GET /ping, which returns a ~45-byte
  "healthy: dynamodb.<region>.amazonaws.com" (200, text/plain, no auth, CORS)
  and is the de-facto AWS latency-check endpoint (cloudping.co and similar
  browser ping tools use it). It answers ICMP, TCP/443 and HTTPS in every
  reachable region, and each resolved IP was confirmed via ip-ranges.json to
  be announced for that same region (DYNAMODB/EC2 service), i.e. truly
  regional, not CloudFront/global. Alternatives checked: s3.<region> answers
  ICMP/TCP too but GET / is a 307 redirect to aws.amazon.com (not a health
  endpoint); ec2.<region> drops ICMP and returns a 301. The previous
  default.yml used s3.<region> hosts; target names are kept unchanged, only
  the host changes to dynamodb.<region>. Cities: AWS publishes only
  region names; city is the best-known metro (N. Virginia = Ashburn,
  Ohio = Columbus area, N. California = San Jose/Bay Area, Oregon = Boardman,
  Central Canada = Montreal, Spain = Aragón/Zaragoza, UAE = Abu Dhabi,
  Malaysia = Kuala Lumpur area, New Zealand = Auckland, Thailand = Bangkok,
  Mexico = Querétaro). me-south-1 (Bahrain) was unreachable on every
  endpoint (dynamodb, s3, ec2, sts: DNS resolves, no ICMP/TCP) on
  2026-09-27; AWS has not restored the region since drone strikes in
  March 2026. It is kept with kinds: [] so it can be re-enabled once
  it answers again. The separate partitions need separate accounts but have
  public endpoints, so they are included and tagged restricted: AWS
  GovCloud us-gov-west-1 (Oregon) / us-gov-east-1 (Ohio), China
  cn-north-1 (Beijing) / cn-northwest-1 (Ningxia) under amazonaws.com.cn
  (also tagged mainland-china), and the AWS European Sovereign Cloud
  eusc-de-east-1 (Brandenburg) under amazonaws.eu. Each IP was confirmed in
  ip-ranges.json for its own region (RTT from Helsinki: GovCloud east/west
  129/175 ms, China 187/190 ms, EUSC 17 ms). Left out: the classified ISO
  partitions (us-iso*, us-isob*, us-isof*, eu-isoe-west-1; not publicly
  reachable), and Local Zones, Wavelength Zones and Outposts (no public
  endpoint of their own; API traffic goes to the parent region).
  Pre-launch: dynamodb.me-west-1 (Saudi Arabia, AWS says December 2026) and
  dynamodb.sa-west-1 (Chile, announced for end-2026) already resolve and
  have AMAZON prefixes in ip-ranges.json, but neither is in AWS's region
  table (still 34 regions) or botocore endpoints.json/partitions.json as
  of 2026-09-27; add them as AWS-me-west-1 / AWS-sa-west-1 once they
  launch. 2026-09-27 audit: every target re-probed (5 pings, 3 TCP
  connects, 3 GETs over ~60 s): 0 loss, valid TLS, 42-50 B bodies, RTT
  spread within a few ms; every resolved IP is in ip-ranges.json for its
  own region only. CloudFront and
  Global Accelerator are anycast and live in the CDN catalog, not here.
  Load: 1 small GET + 1 TCP connect + 3 pings per 15 s against a public
  health endpoint is negligible for AWS.
targets:
