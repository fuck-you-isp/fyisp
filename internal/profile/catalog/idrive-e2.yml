provider: idrive-e2
display: IDrive e2
kind: cloud
category: [storage]
sources:
  - https://www.idrive.com/s3-storage-e2/e2-endpoint-urls
  - https://www.idrive.com/s3-storage-e2/locations
notes: >-
  All 19 IDrive e2 regions from the official endpoint-URL page, probed via the generic regional S3
  hosts s3.<region>.idrivee2.com (per-account endpoints are not public). Anonymous GET / returns a 302
  with a 138 B body. IDrive names some regions only by state (Oregon, Oregon-2, Virginia), so city is
  empty there. RTTs from northern Europe were consistent with the published locations (EU 20-47 ms, US
  East ~111 ms, US West 165-176 ms, Tokyo ~250 ms). The iDrive consumer backup service has no public
  regional endpoints and is not listed separately. Re-checked 2026-09-27: all 19 regions unchanged, no
  new ones by DNS. Every path returns the same 302 to www.idrivee2.com from the nginx front (even with
  an S3-style query), so the redirect cannot be avoided. us-west-3 (San Jose) resolves into the same
  Krypt/Evocative /24 as us-west-2 (Los Angeles) and geolocates to Los Angeles, 3 ms apart; geo-IP
  puts us-east-1 in Manassas and us-west-1/-4 in the Portland area.
targets:
  - name: IDrive-e2-us-west-1
    host: s3.us-west-1.idrivee2.com
    kinds: [https, tcp, icmp]
    region: us-west-1
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 302
      bytes: 138
