provider: serverscom
display: Servers.com
kind: cloud
category: [bare-metal, vps]
sources:
  - https://www.servers.com/data-center-locations/
  - https://www.servers.com/docs/cloud-storage/cloud-storage-openstack-api/
notes: >-
  Servers.com publishes no speed-test or looking-glass hosts. The public cloud regions expose an
  OpenStack Keystone endpoint auth.servers.<region>.cloud.servers.com:5000 (documented in the Cloud
  Storage OpenStack API guide); GET / on port 5000 is the unauthenticated 291 B version-discovery
  document (HTTP 300). Region ids AMS3, AMS4, SJC1 (the "SF" location) and WAS1 were found by DNS;
  the other nine data-center locations are dedicated-server only and have no public unicast endpoint,
  so they are listed as unreachable with www.servers.com as a placeholder host (never probed).
targets:
  - name: ServersCom-ams3
    host: auth.servers.ams3.cloud.servers.com
    kinds: [https, tcp, icmp]
    port: 5000
    region: AMS3
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 300
      bytes: 291
  - name: ServersCom-ams4
    host: auth.servers.ams4.cloud.servers.com
