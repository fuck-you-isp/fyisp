provider: serverscom
display: Servers.com
kind: cloud
category: [bare-metal, vps]
sources:
  - https://www.servers.com/data-center-locations/
  - https://www.servers.com/network/network-performance
notes: >-
  Servers.com (by Nexcess) lists 12 metros (Dallas, Lansing, Miami, New York, San Francisco Bay Area,
  Washington, Amsterdam, London, Luxembourg, Sao Paulo, Hong Kong, Singapore) and 32 data centres, and
  publishes an official test host test.<dc>.servers.com for every data centre on its network-performance
  page ("Test Files"). One target per data centre. GET /robots.txt is a 146 B 404; never fetch the
  100mb.bin / 1000mb.bin files. All hosts are unicast (one A record, geo-IP matches the metro; AMS7 is
  Woerden, DFW5/6 Richardson, NYC1 Secaucus, SJC1 Sunnyvale, WAS2/3 Leesburg, all inside the listed metro). SIN1 is
  published as test.sg01.servers.com, whose HTTPS resets after the handshake; test.sin1.servers.com is
  the same IP with a working certificate and is used instead. Until 2026-09-27 the file used the
  OpenStack Keystone endpoints auth.servers.<region>.cloud.servers.com:5000 for AMS3/AMS4/SJC1/WAS1 and
  placeholders elsewhere; existing target names were kept (the metro-named ones now point at the first
  data centre of that metro).
targets:
  - name: ServersCom-ams3
    host: test.ams3.servers.com
    path: /robots.txt
    kinds: [https, tcp, icmp]
    region: AMS3
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 146
