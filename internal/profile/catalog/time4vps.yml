provider: time4vps
display: Time4VPS
kind: cloud
category: [vps]
sources:
  - https://lg.time4vps.com/
  - https://www.time4vps.com/
notes: >-
  Time4VPS runs a single location in Vilnius, Lithuania (AS212531 Interneto vizija). The official
  looking glass lg.time4vps.com is the published test host (Test IPv4 212.24.110.207, geo-IP Vilnius,
  ~18 ms from Helsinki). GET / is a 7 KB page; /robots.txt is a 208 B 404, so that is probed instead.
  Never fetch the 25MB-1GB test files.
targets:
  - name: Time4VPS-Vilnius
    host: lg.time4vps.com
    kinds: [tcp]
    path: /robots.txt
    region: lt
    city: Vilnius
    country: LT
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 404
      bytes: 208
