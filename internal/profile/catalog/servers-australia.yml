    host: speedtest.mirror.serversaustralia.com.au
    kinds: [tcp]
    region: syd
    city: Sydney
    country: AU
    geo: oc
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 725
