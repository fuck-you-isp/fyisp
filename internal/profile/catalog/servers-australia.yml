provider: servers-australia
display: Servers Australia
kind: cloud
category: [vps, bare-metal]
sources:
  - https://www.serversaustralia.com.au/data-centres
  - https://speedtest.mirror.serversaustralia.com.au/
notes: >-
  Australian VPS and dedicated-server provider with data centres in Sydney (Equinix SY3/SY4),
  Melbourne (ME1), Brisbane (BR1) and Perth (PE2). Its public Speedtest Custom host
  speedtest.mirror.serversaustralia.com.au is in Sydney; GET / is a 725-byte page.
targets:
