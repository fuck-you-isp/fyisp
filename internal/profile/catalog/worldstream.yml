provider: worldstream
display: Worldstream
kind: cloud
category: [bare-metal, vps]
sources:
  - https://www.worldstream.com/en/about-worldstream/our-datacenters/
  - https://www.speedtest.net/
notes: >-
  Worldstream hosts all servers in its own data centres in Naaldwijk (Westland, NL); Haarlem, Amsterdam
  and Frankfurt are network PoPs only. The endpoint is Worldstream's official Ookla speed-test server
  speedtest.worldstream.nl (AS49981, rDNS matches, geo-IP Honselersdijk next to Naaldwijk). Port 80/443
  are closed; the Ookla daemon speaks TLS on 8080 and GET / answers a 109 B banner, so all kinds use
  port 8080.
targets:
  - name: Worldstream-Naaldwijk
    host: speedtest.worldstream.nl
    kinds: [https, tcp, icmp]
    port: 8080
    region: naaldwijk
    city: Naaldwijk
    country: NL
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 109
