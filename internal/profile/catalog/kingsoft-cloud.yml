provider: kingsoft-cloud
display: Kingsoft Cloud
kind: cloud
category: [vps, storage]
sources:
  - https://docs.ksyun.com/documents/6761
notes: >-
  Kingsoft Cloud (Ksyun) KS3 object-storage regions, each probed via ks3-<region>.ksyuncs.com (GET / is
  a ~240-byte 403): Beijing, Shanghai, Guangzhou, Hong Kong, Russia (Moscow), Singapore, Qingyang
  (Gansu), and the finance clouds jr-beijing and jr-shanghai. Chinese geo-IP is coarse: Shanghai
  geolocates to Jiangsu (Suzhou IDC), and Guangzhou geolocates to a Hebei IDC range, so its location is
  unconfirmed. ks3-cn-hk-1 resolves (Hong Kong) but did not answer on 2026-09-27.
targets:
  - name: Kingsoft-cn-beijing
    host: ks3-cn-beijing.ksyuncs.com
    kinds: [https, tcp, icmp]
    region: cn-beijing
    city: Beijing
    country: CN
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 238
  - name: Kingsoft-cn-shanghai
