provider: kingsoft-cloud
display: Kingsoft Cloud
kind: cloud
category: [vps, storage]
sources:
  - https://docs.ksyun.com/documents/6761
notes: >-
  Kingsoft Cloud (Ksyun) KS3 object-storage regions (docs.ksyun.com/documents/6761, 2026-09-27):
  cn-beijing, cn-shanghai, cn-guangzhou, cn-qinghai, cn-qingyang, cn-ningxia, sgp (Singapore) and the
  finance clouds jr-beijing and jr-shanghai. Each is probed via ks3-<region>.ksyuncs.com (GET / is a
  ~240-byte 403). Hong Kong (cn-hk-1) and Russia (rus) are no longer in the KS3 list; rus still answers
  from Moscow and is kept, cn-hk-1 does not. Chinese geo-IP is coarse: Shanghai geolocates to Jiangsu
  (Suzhou IDC). cn-guangzhou's KS3 endpoint is served from a Shijiazhuang (Hebei) IDC, so it is kept
  with kinds []. cn-beijing is carrier-split (Kingsoft Beijing or Tianjin Unicom addresses); the others
  return one answer to every client subnet.
targets:
  - name: Kingsoft-cn-beijing
    host: ks3-cn-beijing.ksyuncs.com
    kinds: [https, tcp, icmp]
    region: cn-beijing
    city: Beijing
    country: CN
    geo: as
    anycast: false
    notes: "carrier-split: Kingsoft Beijing (AS59019) or Tianjin Unicom addresses"
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 238
  - name: Kingsoft-cn-shanghai
    host: ks3-cn-shanghai.ksyuncs.com
    kinds: [https, tcp, icmp]
    region: cn-shanghai
    city: Shanghai
    country: CN
    geo: as
    anycast: false
    notes: geo-IP Jiangsu (Suzhou IDC)
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 403
      bytes: 238
  - name: Kingsoft-cn-guangzhou
    host: ks3-cn-guangzhou.ksyuncs.com
    kinds: []
    region: cn-guangzhou
    city: Guangzhou
    country: CN
    geo: as
    anycast: false
    tags: [unreachable]
    notes: "the KS3 cn-guangzhou endpoint (43.250.35.0/24, AS134760 Shijiazhuang IDC, CHINANET Hebei) is in Hebei: traceroute passes Shijiazhuang (sj.he.163data) and RTT from Helsinki is 167 ms against 180 ms for Beijing. No in-Guangzhou endpoint found (2026-09-27)"
    verified:
