provider: nhn-cloud
display: NHN Cloud
kind: cloud
category: [vps, storage]
sources:
  - https://docs.nhncloud.com/en/nhncloud/en/region-guide/
  - https://docs.nhncloud.com/en/Storage/Object%20Storage/en/api-guide/
notes: >-
  NHN Cloud's four regions are KR1 (Pangyo), KR2 (Pyeongchon), KR3 (Gwangju) and JP1 (Tokyo). Each is
  probed via its regional Object Storage API endpoint <region>-api-object-storage.nhncloudservice.com,
  whose GET / is a 70-byte 404. ICMP is filtered. The former US1 (California) region is no longer
  listed, and its endpoints resolve but did not answer, so it is not included.
targets:
  - name: NHN-kr1
    host: kr1-api-object-storage.nhncloudservice.com
    kinds: []
    notes: "not measured: about half of TCP/HTTPS connects from abroad time out (seen in fyisp and with curl on 2026-09-27); too flaky to measure"
    tags: [unreachable, flaky]
    region: KR1
    city: Pangyo
    country: KR
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 404
      bytes: 70
  - name: NHN-kr2
    host: kr2-api-object-storage.nhncloudservice.com
    kinds: [tcp]
    region: KR2
    city: Pyeongchon
    country: KR
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 404
      bytes: 70
  - name: NHN-kr3
    host: kr3-api-object-storage.nhncloudservice.com
    kinds: []
    notes: "not measured: about half of TCP/HTTPS connects from abroad time out (seen in fyisp and with curl on 2026-09-27); too flaky to measure"
    tags: [unreachable, flaky]
    region: KR3
    city: Gwangju
    country: KR
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 404
      bytes: 70
  - name: NHN-jp1
    host: jp1-api-object-storage.nhncloudservice.com
    kinds: [tcp]
    region: JP1
    city: Tokyo
    country: JP
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: false
      tcp: true
      https: 404
      bytes: 70
