  - https://help.steampowered.com/en/faqs/view/2EA8-4D75-DA21-31EB
notes: >-
  Steam Datagram Relay (SDR) POPs are the relays every Steam game using Valve's
  networking (CS2, Dota 2, Deadlock, many third-party titles) routes through, so they
  are the best regional reference for "gaming latency". Valve publishes them without a
  key via ISteamApps/GetSDRConfig (revision 1790374330 used here); the first relay of each
  POP was taken. Relays speak UDP 27015-27140 only, so these targets are ICMP-only (echo
  verified). Relay IPs rotate occasionally: re-pull GetSDRConfig and refresh when a POP
  stops answering. Omitted: seo (Seoul, all 4 relays drop ICMP), and POPs published
  without relays (ctu/pek/pvg/tgd base, eat, fsn, hel, dsto, dlhr). China POPs are per
  carrier (m = China Mobile, t = Telecom, u = Unicom), tagged china. Store / Web API /
  CDN endpoints are Akamai/Fastly fronts (anycast); paths are tiny (robots.txt,
  GetServerInfo ~70 B, favicon ~1.4 KB).
