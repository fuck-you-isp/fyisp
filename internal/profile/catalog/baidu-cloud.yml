provider: baidu-cloud
display: Baidu AI Cloud
kind: cloud
category: [vps, storage]
sources:
  - https://cloud.baidu.com/doc/BOS/s/xjwvyq9l4
  - https://intl.cloud.baidu.com/zh/doc/BOS/s/xjwvyq9l4-intl
  - https://cloud.baidu.com/doc/Reference/index.html
notes: >-
  Baidu AI Cloud regions: bj (Beijing), gz (Guangzhou), su (Suzhou), bd (Baoding), yq (Yangquan), cd
  (Chengdu), nj (Nanjing), fwh (Wuhan finance), fsh (Shanghai finance), hkg (Hong Kong) and sin
  (Singapore). Baidu's shifen.com GSLB sends non-Chinese resolvers to shared entry points:
  bj/gz/su.bcebos.com all resolve to one Hong Kong front (103.235.47.0/24), and several API gateways
  share addresses. So for each region the endpoint whose address geolocates to that region was picked:
  BOS (<r>.bcebos.com, 101-byte 403), BLS log ingest (bls-log.<r>.baidubce.com, 128-byte 401) or the BCC
  API gateway (bcc.<r>.baidubce.com, 130-byte 400). bj's BLS host geolocates to Shijiazhuang (Hebei,
  next to Baidu's northern data centres), not Beijing city. Chinese geo-IP is coarse, and GSLB answers
  may differ for resolvers inside China. No in-region endpoint was found for fwh, fsh or sin (they
  resolve to Nanjing/Xi'an, Beijing or Hong Kong, or do not answer), so those are kept with kinds [].
targets:
  - name: Baidu-bj
    host: bls-log.bj.baidubce.com
    kinds: [https, tcp, icmp]
    region: bj
    city: Beijing
    country: CN
    geo: as
    anycast: false
    notes: geo-IP Shijiazhuang (Hebei)
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 401
      bytes: 128
