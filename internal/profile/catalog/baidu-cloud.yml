provider: baidu-cloud
display: Baidu AI Cloud
kind: cloud
category: [vps, storage]
sources:
  - https://cloud.baidu.com/doc/BOS/s/xjwvyq9l4
  - https://intl.cloud.baidu.com/zh/doc/BOS/s/xjwvyq9l4-intl
  - https://cloud.baidu.com/doc/Reference/index.html
  - https://cloud.baidu.com/doc/BCC/s/0jwvyo603
notes: >-
  Baidu AI Cloud regions (BCC list, 2026-09-27): bj (Beijing), bd (Baoding), gz (Guangzhou), su
  (Suzhou), cd (Chengdu), fwh (Wuhan) and hkg (Hong Kong); BOS adds yq (Yangquan) and fsh (Shanghai
  finance). nj (Nanjing) is no longer in the BCC or BOS docs, but its BLS endpoint still answers from
  Nanjing. sin (Singapore) is gone: bcc.sin CNAMEs to domain-offline.baidu.com. Baidu's shifen.com GSLB
  splits answers by carrier (EDNS client-subnet test, 2026-09-27): China Telecom clients get Telecom
  addresses, and Unicom and foreign clients get Unicom ones. Both stay in the region's area, but for bj
  the foreign answer is in Chengde (Hebei), not Beijing. Non-Chinese resolvers also get shared entry
  points: bj/gz/su.bcebos.com all resolve to one Hong Kong front (103.235.47.0/24), and several API
  gateways share addresses. So for each region the endpoint whose address geolocates to that region was
  picked: BOS (<r>.bcebos.com, 101-byte 403), BLS log ingest (bls-log.<r>.baidubce.com, 128-byte 401) or
  the BCC API gateway (bcc.<r>.baidubce.com, 130-byte 400). Chinese geo-IP is coarse. No in-region
  endpoint was found for fwh or fsh, so they are kept with kinds [].
targets:
  - name: Baidu-bj
    host: bls-log.bj.baidubce.com
    kinds: [tcp]
    region: bj
    city: Beijing
    country: CN
    geo: as
    anycast: false
    notes: "GeoDNS: Telecom clients get 220.181.111.0/24 (Beijing), Unicom and foreign clients 110.242.69.0/24 (Chengde, Hebei)"
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 401
      bytes: 128
