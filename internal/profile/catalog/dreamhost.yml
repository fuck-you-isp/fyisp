provider: dreamhost
display: DreamHost (DreamCompute)
kind: cloud
category: [vps, storage]
sources:
  - https://help.dreamhost.com/hc/en-us/articles/360003842672-Data-center-FAQs
  - https://help.dreamhost.com/hc/en-us/articles/115001728332-DreamCompute-FAQs
notes: >-
  DreamHost lists four datacenters (US East Ashburn, US West Hillsboro, EU Amsterdam, AP Southeast
  Singapore) and publishes no speed-test hosts. US East uses the DreamCompute API iad2.dream.io
  (HTTPS 302, empty body) and US West the legacy DreamObjects host objects-us-west-1.dream.io
  (HTTP-only; its rDNS is a pdx1 DreamHost server, RTT fits Oregon). No public endpoint was found
  for Amsterdam or Singapore. lg.dreamhost.com resolves but its rDNS is a third-party domain and it
  did not answer, so it is not used.
targets:
  - name: DreamHost-us-east
    host: iad2.dream.io
    kinds: [https, tcp, icmp]
    region: iad2
    city: Ashburn
    country: US
    geo: na
    anycast: false
    notes: DreamCompute API (US-East-2)
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 302
      bytes: 0
  - name: DreamHost-us-west
    host: objects-us-west-1.dream.io
    kinds: [tcp, icmp]
    port: 80
    region: pdx1
    city: Hillsboro
    country: US
    geo: na
    anycast: false
    notes: legacy DreamObjects host; HTTP-only (port 80)
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
  - name: DreamHost-eu
    host: ams1.dreamhost.com
    kinds: []
    region: ams1
    city: Amsterdam
    country: NL
    geo: eu
    anycast: false
    tags: [unreachable]
    notes: no public endpoint found
    verified:
      date: 2026-09-27
      icmp: false
      tcp: false
  - name: DreamHost-ap-southeast
    host: sin1.dreamhost.com
    kinds: []
    region: sin1
    city: Singapore
    country: SG
    geo: as
    anycast: false
    tags: [unreachable]
    notes: no public endpoint found
    verified:
      date: 2026-09-27
      icmp: false
      tcp: false
