provider: contabo
display: Contabo
kind: cloud
category: [storage]
sources:
  - https://contabo.com/blog/how-to-perform-a-network-speedtest/
  - https://docs.contabo.com/docs/products/Object-Storage/Tools/s3cmd/
  - https://help.contabo.com/en/support/solutions/articles/103000283038-how-do-i-use-s3-object-storage-in-my-code-
notes: >-
  Contabo runs no looking-glass or per-DC speed-test hosts (it recommends Ookla). The only public
  regional endpoints are its Object Storage S3 hosts <region>.contabostorage.com; anonymous GET /
  returns 401 (26 B), which counts as reachable. eu2 is in Germany (exact DC unpublished), usc1 is
  St. Louis, sin1 is Singapore.
  Gaps: no endpoint for Contabo compute regions US-East (NY), US-West (Seattle), UK, Japan, Australia, India.
targets:
  - name: Contabo-eu2
    host: eu2.contabostorage.com
    kinds: [https, tcp, icmp]
    region: eu2
    country: DE
    geo: eu
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 401
      bytes: 26
  - name: Contabo-usc1
    host: usc1.contabostorage.com
    kinds: [https, tcp, icmp]
    region: usc1
    city: St. Louis
    country: US
    geo: na
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 401
      bytes: 26
  - name: Contabo-sin1
    host: sin1.contabostorage.com
    kinds: [https, tcp, icmp]
    region: sin1
    city: Singapore
    country: SG
    geo: as
    anycast: false
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 401
      bytes: 26
