    country: DE
    geo: eu
    anycast: false
    notes: >-
      Second EU-region DC (geofeed Karlsruhe, ~31 ms from Helsinki). Official speed-test host; GET / is an empty 200.
    verified:
      date: 2026-09-27
      icmp: true
      tcp: true
      https: 200
      bytes: 0
