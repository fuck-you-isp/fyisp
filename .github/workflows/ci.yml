name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux: the same Dockerfile targets used locally (no Go on the host).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: fmt, vet, test -race
        run: docker buildx build --target test .
      - name: go mod tidy is clean
        run: |
          docker buildx build --target modfiles --output type=local,dest=. .
          git diff --exit-code -- go.mod go.sum
      - name: cross-build release matrix
        run: docker buildx build --target dist --output type=local,dest=dist .
      - name: launcher tests (run.sh, run.ps1) and systemd unit
        run: |
          docker buildx build --target launchertest .
          docker buildx build --target launchertest-pwsh .
          docker buildx build --target servicetest .
      - name: runtime image upgrades a v1 database (scratch image, no /tmp)
        run: |
          docker buildx build --target image --load -t fyisp:ci .
          docker volume create fyisp-ci
          docker run --rm -v fyisp-ci:/data -v "$PWD/internal/store/testdata:/fx:ro" busybox \
            sh -c 'cp /fx/v1.db /data/fyisp.db && chown -R 65532:65532 /data && chmod 700 /data'
          docker run -d --name fyisp-ci -v fyisp-ci:/data fyisp:ci --log-format text
          for i in $(seq 1 30); do docker logs fyisp-ci 2>&1 | grep -q 'fyisp started' && break; sleep 1; done
          docker logs fyisp-ci 2>&1 | grep -v DEBUG
          test "$(docker inspect -f '{{.State.Running}}' fyisp-ci)" = true
          docker logs fyisp-ci 2>&1 | grep -q 'fyisp started'
          ! docker logs fyisp-ci 2>&1 | grep -q 'fyisp stopped'
          docker run --rm -v fyisp-ci:/data busybox ls -la /data | grep -q 'fyisp.db.bak-v1'
          docker rm -f fyisp-ci
      - name: binary size budget (50 MB)
        run: |
          ls -l dist
          for f in dist/fyisp-*; do s=$(stat -c %s "$f"); [ "$s" -le 52428800 ] || { echo "$f is $s bytes"; exit 1; }; done

  # UI tests (Playwright in Docker). Advisory: not a required check; runs only
  # when the web UI changes.
  ui:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: web UI changed?
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null || [ "$base" = 0000000000000000000000000000000000000000 ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base" HEAD -- Dockerfile .dockerignore .github/workflows/ci.yml go.mod go.sum 'internal/**' 'test/ui/**' 'cmd/fyisp-webdev/**' | grep -q .; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changed.outputs.run == 'true'
      - name: Playwright smoke and UI specs
        if: steps.changed.outputs.run == 'true'
        run: docker buildx build --target uitest-report --output type=local,dest=ui-out . && test "$(cat ui-out/status)" = 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.changed.outputs.run == 'true'
        with:
          name: ui-report
          path: ui-out/
          retention-days: 7

  # Windows and macOS: native tests, because ICMP and paths are OS-specific.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - run: go vet ./...
      - run: go test ./...
